<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorías</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
</head>
<body style="font-family: 'Poppins', sans-serif;">
<div class="container mx-auto mt-5">
    <h1 class="text-2xl font-bold mb-4">Gestión de Categorías</h1>

    <!-- Mensajes flash -->
    <div th:if="${mensaje}" class="bg-green-100 text-green-700 p-3 mb-4 rounded" th:text="${mensaje}"></div>
    <div th:if="${error}" class="bg-red-100 text-red-700 p-3 mb-4 rounded" th:text="${error}"></div>

    <!-- Botón para nuevo -->
    <a th:href="@{/view/categorias/form}" class="bg-blue-500 text-white px-4 py-2 rounded mb-4 inline-block">Nueva Categoría</a>

    <!-- Tabla -->
    <table class="min-w-full bg-white border border-gray-200 mt-3">
        <thead>
        <tr class="bg-gray-100 border-b">
            <th class="py-2 px-4 border-r">ID</th>
            <th class="py-2 px-4 border-r">Nombre</th>
            <th class="py-2 px-4 border-r">Descripción</th>
            <th class="py-2 px-4">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cat : ${categorias}" class="border-b">
            <td class="py-2 px-4 border-r text-center" th:text="${cat.id}"></td>
            <td class="py-2 px-4 border-r" th:text="${cat.nombre}"></td>
            <td class="py-2 px-4 border-r" th:text="${cat.descripcion}"></td>
            <td class="py-2 px-4 text-center">
                <a th:href="@{/view/categorias/edit/{id}(id=${cat.id})}" class="text-yellow-600 mr-2">Editar</a>
                <form th:action="@{/view/categorias/delete/{id}(id=${cat.id})}" method="post" class="inline">
                    <button type="submit" class="text-red-600" onclick="return confirm('¿Estás seguro de eliminar esta categoría?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
