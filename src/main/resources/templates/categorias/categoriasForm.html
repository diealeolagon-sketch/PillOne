<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PillOne - Categoría</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:['Poppins','sans-serif']
                    }
                }
            }
        }
    </script>


    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .category-form-shell{
            background:
                radial-gradient(circle at top right,rgba(32,138,174,.055),transparent 26rem),
                var(--pillone-bg);
        }
        .category-form-panel{
            background:rgba(255,255,255,.98);
            border:1px solid var(--ui-border);
            box-shadow:var(--ui-shadow);
        }
        .category-control{
            border:1px solid var(--ui-border);
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .category-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        .field-label{
            display:block;
            color:#475467;
            font-size:11px;
            font-weight:700;
            letter-spacing:.04em;
            text-transform:uppercase;
            margin-bottom:.45rem;
        }
        .helper-note{
            margin-top:.4rem;
            color:#98A2B3;
            font-size:10px;
            line-height:1.5;
        }
        @media(max-width:640px){
            .category-form-main{padding:1rem!important;}
            .category-form-header{
                align-items:stretch!important;
            }
            .category-form-header>a{width:100%;}
            .category-form-actions{
                display:grid!important;
                grid-template-columns:1fr 1fr;
            }
            .category-form-actions>*{
                width:100%;
                text-align:center;
            }
        }
    </style>

</head>

<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Gestión de Categorías')"></header>

<div class="flex flex-1 relative category-form-shell">

    <div id="overlay"
         onclick="toggleSidebar()"
         class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('categorias')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="category-form-main flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <section class="mb-5">

                <div class="category-form-header flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                    <div>

                        <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark"
                            th:text="${categoria.idCategoria != null ? 'Editar Categoría' : 'Nueva Categoría'}">
                            Categoría
                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Define una categoría para organizar los productos.
                        </p>

                    </div>

                    <a th:href="@{/view/categorias}"
                       class="inline-flex items-center justify-center gap-2 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold hover:bg-slate-50 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>Volver
                    </a>

                </div>

            </section>

            <div th:if="${error}"
                 class="mb-4 rounded-lg bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                 th:text="${error}">
            </div>

            <section class="category-form-panel rounded-2xl overflow-hidden">

                <form th:action="@{/view/categorias/save}"
                      th:object="${categoria}"
                      method="post"
                      class="p-5 sm:p-7">

                    <div class="mb-6 p-4 rounded-xl bg-slate-50 border border-slate-100 flex items-start gap-3">
                        <div class="w-9 h-9 rounded-xl bg-pillone-accent/10 text-pillone-accent flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h5l9 9-7 7-9-9V6z"/>
                                <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-pillone-dark">Clasificación del catálogo</p>
                            <p class="text-[10px] text-slate-500 mt-1 leading-relaxed">Usa nombres claros y consistentes para que el equipo encuentre los medicamentos más rápido.</p>
                        </div>
                    </div>

                    <input type="hidden"
                           th:field="*{idCategoria}">

                    <div class="mb-5">

                        <label class="field-label">
                            Nombre
                            <span class="text-red-500">*</span>
                        </label>

                        <input type="text"
                               th:field="*{nombre}"
                               required
                               maxlength="100"
                               placeholder="Ej. Analgésicos y Antiinflamatorios"
                               class="category-control w-full px-3.5 py-3 rounded-xl outline-none">

                        <div th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}"
                             class="text-red-500 text-[10px] mt-1">
                        </div>

                    </div>

                    <div class="mb-6">

                        <label class="field-label">
                            Descripción
                        </label>

                        <textarea th:field="*{descripcion}"
                                  rows="4"
                                  placeholder="Descripción de la categoría..."
                                  class="category-control w-full px-3.5 py-3 rounded-xl outline-none resize-none">
                        </textarea>

                    </div>

                    <div class="category-form-actions flex justify-end gap-2">

                        <a th:href="@{/view/categorias}"
                           class="px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold hover:bg-slate-50 transition">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="px-5 py-2.5 rounded-xl bg-pillone-dark text-white font-semibold hover:bg-pillone-darker transition"
                                th:text="${categoria.idCategoria != null ? 'Guardar Cambios' : 'Crear Categoría'}">
                            Guardar
                        </button>

                    </div>

                </form>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>
    function toggleSidebar(){
        document.querySelector('aside').classList.toggle('-translate-x-full');
        document.getElementById('overlay').classList.toggle('hidden');
    }
</script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
