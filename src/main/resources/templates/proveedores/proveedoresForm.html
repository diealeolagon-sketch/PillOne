<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PillOne - Proveedor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <th:block th:replace="fragments/layout :: styles"></th:block>

</head>


<body class="bg-pillone-bg font-sans text-pillone-text min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Proveedores')"></header>

<div class="flex flex-1 relative">

    <aside th:replace="fragments/layout :: sidebar('proveedores')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">


            <section class="mb-5">

                <div class="flex items-center justify-between">

                    <div>

                        <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase"
                            th:text="${proveedor.id_proveedor != null ? 'Editar Proveedor' : 'Nuevo Proveedor'}">

                            Proveedor

                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Registre los datos comerciales y de contacto del proveedor.
                        </p>

                    </div>


                    <a th:href="@{/view/proveedores}"
                       class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-semibold">

                        ← Volver

                    </a>

                </div>

            </section>


            <div th:if="${error}"
                 class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 font-semibold"
                 th:text="${error}">
            </div>


            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

                <form th:action="@{/view/proveedores/save}"
                      th:object="${proveedor}"
                      method="post"
                      class="space-y-6">


                    <input type="hidden"
                           th:field="*{id_proveedor}">


                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">


                        <div>

                            <label class="block font-semibold mb-1">
                                NIT *
                            </label>

                            <input type="text"
                                   th:field="*{nit}"
                                   required
                                   placeholder="Ej. 900123456-1"
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div>

                            <label class="block font-semibold mb-1">
                                Razón Social *
                            </label>

                            <input type="text"
                                   th:field="*{razon_social}"
                                   required
                                   placeholder="Ej. Distribuciones Farmacéuticas S.A.S."
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div>

                            <label class="block font-semibold mb-1">
                                Dirección *
                            </label>

                            <input type="text"
                                   th:field="*{direccion}"
                                   required
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div>

                            <label class="block font-semibold mb-1">
                                Teléfono *
                            </label>

                            <input type="text"
                                   th:field="*{telefono}"
                                   required
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div>

                            <label class="block font-semibold mb-1">
                                Correo *
                            </label>

                            <input type="email"
                                   th:field="*{correo}"
                                   required
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div>

                            <label class="block font-semibold mb-1">
                                Nombre de Contacto *
                            </label>

                            <input type="text"
                                   th:field="*{nombre_contacto}"
                                   required
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div class="sm:col-span-2">

                            <label class="block font-semibold mb-1">
                                Tipo de Productos *
                            </label>

                            <input type="text"
                                   th:field="*{tipo_productos}"
                                   required
                                   placeholder="Ej. Medicamentos, cuidado personal, dispositivos médicos..."
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                        </div>


                        <div>

                            <label class="block font-semibold mb-1">
                                Estado *
                            </label>

                            <select th:field="*{estado}"
                                    required
                                    class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                                <option value="ACTIVO">
                                    ACTIVO
                                </option>

                                <option value="INACTIVO">
                                    INACTIVO
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="flex justify-end gap-3 pt-4 border-t">

                        <a th:href="@{/view/proveedores}"
                           class="px-5 py-2.5 rounded-lg bg-slate-100 text-slate-600 font-semibold">

                            Cancelar

                        </a>


                        <button type="submit"
                                class="px-5 py-2.5 rounded-lg bg-pillone-accent text-white font-bold">

                            <span th:text="${proveedor.id_proveedor != null ? 'Guardar Cambios' : 'Guardar Proveedor'}">
                                Guardar Proveedor
                            </span>

                        </button>

                    </div>

                </form>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
