<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Empleado</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { font-family: var(--font-family-base, 'Poppins', sans-serif); }
    </style>
</head>

<body class="bg-[var(--pillone-bg,#F7F7FF)] text-[var(--pillone-text,#1D1E18)]">

<div class="min-h-screen flex">

    <div th:replace="fragments/layout :: sidebar('empleados')"></div>

    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>

    <div class="flex-1 min-w-0">

        <div th:replace="fragments/layout :: topbar('ODIN')"></div>

        <main class="px-4 md:px-8 py-6">

            <section class="mb-5">
                <h1 class="text-2xl md:text-3xl font-extrabold text-[var(--pillone-dark,#07004D)] uppercase">
                    Módulo de Empleados
                </h1>
                <p class="text-sm text-slate-500 mt-1">
                    Gestión de datos de empleados del sistema ODIN
                </p>
            </section>

            <form th:action="@{/view/empleados/save}"
                  th:object="${empleado}"
                  method="post"
                  novalidate>

                <input type="hidden" th:field="*{id_empleado}" />

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">

                    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                        <div class="px-5 py-4 border-b border-slate-100">
                            <h2 class="text-sm font-extrabold text-[var(--pillone-dark,#07004D)] uppercase flex items-center gap-2">
                                👤 Información del Empleado
                            </h2>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">

                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Nombre completo
                                </label>
                                <input type="text" th:field="*{nombre_completo}" required
                                       placeholder="Nombres y Apellidos"
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Tipo de documento
                                </label>
                                <select th:field="*{tipo_documento}" required
                                        class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                                    <option value="CC">CC</option>
                                    <option value="CE">CE</option>
                                    <option value="PASAPORTE">PASAPORTE</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Número de documento
                                </label>
                                <input type="text" th:field="*{numero_documento}" required
                                       placeholder="Número de documento"
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Teléfono
                                </label>
                                <input type="text" th:field="*{telefono}"
                                       placeholder="Teléfono móvil"
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Dirección
                                </label>
                                <input type="text" th:field="*{direccion}"
                                       placeholder="Dirección de residencia"
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                        </div>
                    </section>

                    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                        <div class="px-5 py-4 border-b border-slate-100">
                            <h2 class="text-sm font-extrabold text-[var(--pillone-dark,#07004D)] uppercase flex items-center gap-2">
                                💼 Información Laboral y Contacto
                            </h2>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">

                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Correo electrónico
                                </label>
                                <input type="email" th:field="*{correo}"
                                       placeholder="correo@ejemplo.com"
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Cargo
                                </label>
                                <input type="text" th:field="*{cargo}" required
                                       placeholder="Ej: Farmacéutico, Regente..."
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Salario
                                </label>
                                <input type="number" step="0.01" th:field="*{salario}" required
                                       placeholder="Monto de salario"
                                       class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Estado
                                </label>
                                <select th:field="*{estado}" required
                                        class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[var(--pillone-accent,#208AAE)] focus:bg-white">
                                    <option value="ACTIVO">ACTIVO</option>
                                    <option value="INACTIVO">INACTIVO</option>
                                </select>
                            </div>

                        </div>
                    </section>

                </div>

                <div class="flex justify-end gap-3 mt-5">
                    <a th:href="@{/view/empleados}"
                       class="rounded-lg border border-[var(--pillone-accent,#208AAE)] bg-white px-6 py-2.5 text-sm font-semibold text-[var(--pillone-accent,#208AAE)] hover:bg-[var(--pillone-bg,#F7F7FF)] transition">
                        Limpiar / Volver
                    </a>

                    <button type="submit"
                            class="rounded-lg bg-[var(--pillone-accent,#208AAE)] px-7 py-2.5 text-sm font-bold text-white hover:opacity-90 transition">
                        ▶ Guardar Empleado
                    </button>
                </div>

            </form>

        </main>
    </div>
</div>

<script th:src="@{/js/script.js}" defer></script>

</body>
</html>
