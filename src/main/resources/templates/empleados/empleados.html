<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Empleados - PillOne
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>

        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:[
                            'Poppins',
                            'sans-serif'
                        ]
                    }
                }
            }
        }

    </script>

</head>

<body class="bg-pillone-bg text-pillone-text antialiased min-h-screen flex flex-col text-xs font-sans">

<header th:replace="fragments/layout :: topbar('Gestión de Empleados')"></header>

<div class="flex flex-1 relative">

    <div
            id="overlay"
            onclick="toggleSidebar()"
            class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('empleados')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5">

                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                    <div>

                        <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase tracking-tight">

                            Empleados y accesos

                        </h1>

                        <p class="text-xs text-slate-500 mt-1">

                            Administra el personal y sus credenciales de ingreso desde un solo módulo.

                        </p>

                    </div>

                    <a
                            th:href="@{/view/empleados/form}"
                            class="inline-flex items-center justify-center gap-2 rounded-lg bg-pillone-accent px-4 py-2.5 font-bold text-white shadow-sm hover:opacity-90 transition">

                        + Nuevo Empleado

                    </a>

                </div>

            </section>

            <!-- MENSAJE -->
            <div
                    th:if="${mensaje}"
                    class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-emerald-800 font-medium"
                    th:text="${mensaje}">
            </div>

            <!-- ERROR -->
            <div
                    th:if="${error}"
                    class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                    th:text="${error}">
            </div>

            <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

                <!-- BUSCADOR -->
                <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                    <div class="relative w-full sm:w-96">

                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">

                            ⌕

                        </span>

                        <input
                                type="text"
                                id="buscador-tabla"
                                onkeyup="filtrarTabla()"
                                placeholder="Buscar empleado, documento, usuario, rol..."
                                class="w-full pl-8 pr-3 py-2 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                    </div>

                    <span class="text-slate-500">

                        Total:

                        <b
                                id="contador-total"
                                th:text="${#lists.size(empleados)}">

                            0

                        </b>

                    </span>

                </div>

                <!-- TABLA -->
                <div class="overflow-x-auto">

                    <table class="min-w-[1150px] w-full text-xs">

                        <thead>

                        <tr class="bg-pillone-dark text-white text-left text-[10px] uppercase tracking-wider">

                            <th class="px-4 py-3.5 font-bold">
                                Documento
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Nombre
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Cargo / Salario
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Sucursal
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Acceso / Rol
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Contacto
                            </th>

                            <th class="px-4 py-3.5 text-center font-bold">
                                Estado
                            </th>

                            <th class="px-4 py-3.5 text-center font-bold">
                                Acciones
                            </th>

                        </tr>

                        </thead>

                        <tbody class="divide-y divide-slate-100">

                        <tr
                                th:each="empleado : ${empleados}"
                                class="fila-empleado hover:bg-slate-50 transition"
                                th:with="u=${usuariosPorEmpleado.get(empleado.id_empleado)}">

                            <!-- DOCUMENTO -->
                            <td class="px-4 py-3.5">

                                <span
                                        class="font-bold text-pillone-accent"
                                        th:text="${empleado.tipo_documento+' - '+empleado.numero_documento}">
                                </span>

                            </td>

                            <!-- NOMBRE -->
                            <td
                                    class="px-4 py-3.5 font-semibold text-slate-700"
                                    th:text="${empleado.nombre_completo}">
                            </td>

                            <!-- CARGO -->
                            <td class="px-4 py-3.5">

                                <div
                                        class="text-slate-700 font-medium"
                                        th:text="${empleado.cargo}">
                                </div>

                                <div
                                        class="text-[10px] font-semibold text-pillone-dark"
                                        th:text="${empleado.salario != null ? '$'+#numbers.formatDecimal(empleado.salario,0,'POINT',2,'COMMA') : 'N/A'}">
                                </div>

                            </td>

                            <!-- SUCURSAL -->
                            <td
                                    class="px-4 py-3.5 text-slate-600 font-medium"
                                    th:text="${empleado.sucursal != null ? empleado.sucursal.nombre : 'Sin sucursal'}">
                            </td>

                            <!-- ACCESO -->
                            <td class="px-4 py-3.5">

                                <div th:if="${u != null}">

                                    <div
                                            class="font-bold text-pillone-dark"
                                            th:text="${u.username}">
                                    </div>

                                    <div class="flex flex-wrap items-center gap-1 mt-1">

                                        <span
                                                class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 text-[9px] font-bold"
                                                th:text="${u.rol != null ? #strings.replace(u.rol.nombre,'_',' ') : 'SIN ROL'}">
                                        </span>

                                        <span
                                                class="px-2 py-0.5 rounded-full text-[9px] font-bold"
                                                th:classappend="${u.estado.name() == 'ACTIVO' ? 'bg-emerald-50 text-emerald-700' : (u.estado.name() == 'BLOQUEADO' ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-600')}"
                                                th:text="${u.estado}">
                                        </span>

                                    </div>

                                </div>

                                <div
                                        th:if="${u == null}"
                                        class="text-amber-600 font-semibold">

                                    Sin acceso creado

                                </div>

                            </td>

                            <!-- CONTACTO -->
                            <td class="px-4 py-3.5">

                                <div
                                        class="text-slate-600"
                                        th:text="${empleado.telefono != null ? empleado.telefono : '-'}">
                                </div>

                                <div
                                        class="text-slate-400 text-[10px]"
                                        th:text="${empleado.correo != null ? empleado.correo : '-'}">
                                </div>

                            </td>

                            <!-- ESTADO -->
                            <td class="px-4 py-3.5 text-center">

                                <span
                                        class="inline-flex px-2 py-0.5 rounded-full text-[10px] font-bold"
                                        th:classappend="${empleado.estado == 'ACTIVO' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}"
                                        th:text="${empleado.estado}">
                                </span>

                            </td>

                            <!-- ACCIONES -->
                            <td class="px-4 py-3.5 text-center">

                                <div class="flex items-center justify-center gap-1.5">

                                    <a
                                            th:href="@{/view/empleados/edit/{id}(id=${empleado.id_empleado})}"
                                            class="px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-semibold hover:bg-blue-100 transition">

                                        Editar

                                    </a>

                                    <form
                                            th:action="@{/view/empleados/delete/{id}(id=${empleado.id_empleado})}"
                                            method="post"
                                            onsubmit="return confirm('¿Seguro que deseas eliminar este empleado? Si tiene historial, el sistema no permitirá borrarlo.');">

                                        <button
                                                type="submit"
                                                class="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-700 font-semibold hover:bg-red-100 transition">

                                            Eliminar

                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(empleados)}">

                            <td
                                    colspan="8"
                                    class="px-6 py-12 text-center text-slate-400">

                                No hay empleados registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

        <footer th:replace="fragments/layout :: footer"></footer>

    </div>

</div>

<div th:replace="fragments/layout :: scripts"></div>

<script>

    function filtrarTabla(){

        const q=
            document
                .getElementById('buscador-tabla')
                .value
                .toLowerCase()
                .trim();

        let visibles=0;

        document
            .querySelectorAll('.fila-empleado')
            .forEach(
                f=>{

                    const mostrar=
                        !q ||
                        f.textContent
                            .toLowerCase()
                            .includes(q);

                    f.style.display=
                        mostrar
                            ? ''
                            : 'none';

                    if(mostrar){
                        visibles++;
                    }
                }
            );

        document
            .getElementById('contador-total')
            .textContent=
                visibles;
    }

</script>

<script th:src="@{/js/script.js}" defer></script>

</body>

</html>
