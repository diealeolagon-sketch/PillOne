<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${sucursal.idSucursal == null ? 'Nueva sucursal - PillOne' : 'Editar sucursal - PillOne'}"></title>
<th:block th:replace="~{fragments/layout :: styles}"></th:block>
<style>.form-card{background:#fff;border:1px solid #E7E9F0;box-shadow:0 16px 45px rgba(7,0,77,.07);animation:rise .28s ease}.control{border:1px solid #E2E8F0;background:#FBFCFE;transition:.18s}.control:focus{border-color:#208AAE;box-shadow:0 0 0 3px rgba(32,138,174,.12);background:#fff}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
</head>
<body class="bg-pillone-bg font-sans text-pillone-text min-h-screen">
<header th:replace="~{fragments/layout :: topbar('Sucursales')}"></header>
<div class="flex min-h-[calc(100vh-4rem)]"><aside th:replace="~{fragments/layout :: sidebar('sucursales')}"></aside>
<main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8"><div class="max-w-4xl mx-auto">
<a th:href="@{/view/sucursales}" class="text-xs font-bold text-slate-400 hover:text-pillone-accent">← Volver a sucursales</a>
<div class="mt-3 mb-5"><h1 class="text-2xl sm:text-3xl font-extrabold text-pillone-dark" th:text="${sucursal.idSucursal == null ? 'Nueva sucursal' : 'Editar sucursal'}"></h1><p class="text-sm text-slate-500 mt-1">Configura los datos operativos de la sede.</p></div>
<div th:if="${error}" class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm" th:text="${error}"></div>
<form th:action="@{/view/sucursales/save}" th:object="${sucursal}" method="post" class="form-card rounded-2xl p-5 sm:p-7">
<input type="hidden" th:field="*{idSucursal}">
<div class="grid sm:grid-cols-2 gap-4">
<div><label class="text-xs font-bold text-slate-500">Nombre *</label><input th:field="*{nombre}" required class="control mt-1 w-full rounded-xl px-4 py-3 outline-none"></div>
<div><label class="text-xs font-bold text-slate-500">Código *</label><input th:field="*{codigo}" required class="control mt-1 w-full rounded-xl px-4 py-3 outline-none uppercase"></div>
<div class="sm:col-span-2"><label class="text-xs font-bold text-slate-500">Dirección *</label><input th:field="*{direccion}" required class="control mt-1 w-full rounded-xl px-4 py-3 outline-none"></div>
<div><label class="text-xs font-bold text-slate-500">Teléfono</label><input th:field="*{telefono}" class="control mt-1 w-full rounded-xl px-4 py-3 outline-none"></div>
<div><label class="text-xs font-bold text-slate-500">Estado</label><select th:field="*{estado}" class="control mt-1 w-full rounded-xl px-4 py-3 outline-none"><option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option></select></div>
<div><label class="text-xs font-bold text-slate-500">Ciudad</label><input th:field="*{ciudad}" class="control mt-1 w-full rounded-xl px-4 py-3 outline-none"></div>
<div><label class="text-xs font-bold text-slate-500">Departamento</label><input th:field="*{departamento}" class="control mt-1 w-full rounded-xl px-4 py-3 outline-none"></div>
</div>
<div class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-3"><a th:href="@{/view/sucursales}" class="px-5 py-3 rounded-xl border border-slate-200 text-sm font-bold text-slate-600 text-center">Cancelar</a><button class="px-6 py-3 rounded-xl bg-pillone-dark text-white text-sm font-bold hover:-translate-y-0.5 transition" th:text="${sucursal.idSucursal == null ? 'Crear sucursal' : 'Guardar cambios'}"></button></div>
</form></div></main></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
