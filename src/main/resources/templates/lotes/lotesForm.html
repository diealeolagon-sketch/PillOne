<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Nuevo Lote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:['Poppins','sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .lot-form-shell{background:var(--pillone-bg);}
        .lot-form-panel{
            background:#fff;
            border:1px solid var(--ui-border);
            box-shadow:var(--ui-shadow);
        }
        .lot-control{
            border:1px solid var(--ui-border);
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .lot-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        .lot-label{
            display:block;
            color:#475467;
            font-size:11px;
            font-weight:700;
            letter-spacing:.035em;
            text-transform:uppercase;
            margin-bottom:.45rem;
        }
        .entry-option{
            text-align:center;
            border:1px solid var(--ui-border);
            border-radius:.85rem;
            padding:.85rem;
            background:#fff;
            font-weight:600;
            transition:border-color .15s ease,background .15s ease,color .15s ease,transform .15s ease;
        }
        .peer:checked + .entry-option{
            border-color:var(--pillone-accent);
            background:rgba(32,138,174,.08);
            color:var(--pillone-accent);
        }
        .lot-actions{
            position:sticky;
            bottom:0;
            z-index:5;
            background:rgba(255,255,255,.97);
            backdrop-filter:blur(10px);
        }
        @media(max-width:640px){
            .lot-form-main{padding:1rem!important;}
            .lot-entry-grid{grid-template-columns:1fr!important;}
            .lot-summary-grid{grid-template-columns:1fr!important;}
            .lot-actions{
                display:grid!important;
                grid-template-columns:1fr;
            }
            .lot-actions>*{width:100%;justify-content:center;text-align:center;}
        }
    </style>

</head>

<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Nuevo Lote')"></header>

<div class="lot-form-shell flex flex-1 relative">

    <div id="overlay"
         onclick="toggleSidebar()"
         class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('productos')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="lot-form-main flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6">

                <a th:href="${productoId != null ? '/view/lotes?productoId='+productoId : '/view/lotes'}"
                   class="inline-flex items-center gap-2 text-slate-500 hover:text-pillone-accent font-semibold">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>Volver a lotes

                </a>

                <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark mt-3">
                    Registrar entrada de inventario
                </h1>

                <p class="text-xs text-slate-500 mt-1">
                    Selecciona el producto, identifica el lote y registra la mercancía recibida.
                </p>

            </div>

            <div th:if="${error}"
                 class="mb-5 rounded-lg bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                 th:text="${error}">
            </div>

            <form th:action="@{/view/lotes/save}"
                  method="post"
                  class="lot-form-panel rounded-2xl overflow-hidden">

                <div class="p-5 md:p-6 space-y-5">

                    <div>

                        <label class="lot-label">
                            Producto
                        </label>

                        <select id="producto"
                                name="idProducto"
                                required
                                onchange="actualizarProducto()"
                                class="lot-control w-full px-3.5 py-3 rounded-xl outline-none">

                            <option value="">
                                Seleccione un producto
                            </option>

                            <option th:each="p : ${productos}"
                                    th:value="${p.idProducto}"
                                    th:selected="${productoId != null && productoId == p.idProducto}"
                                    th:attr="
                                        data-sellos=${p.sellosPorCaja != null ? p.sellosPorCaja : 1},
                                        data-unidades-sello=${p.unidadesPorSello != null ? p.unidadesPorSello : 1},
                                        data-unidades-caja=${p.unidadesPorEmpaque != null ? p.unidadesPorEmpaque : 1}
                                    "
                                    th:text="${p.nombreComercial}">
                            </option>

                        </select>

                    </div>

                    <div id="resumenProducto"
                         class="hidden rounded-2xl bg-slate-50 border border-slate-200 p-4">

                        <div class="text-[10px] uppercase font-bold text-pillone-accent mb-2">
                            Configuración del producto
                        </div>

                        <div class="lot-summary-grid grid grid-cols-3 gap-2">

                            <div class="bg-white rounded-xl p-3 border border-slate-200">

                                <div class="text-[9px] text-slate-400 uppercase">
                                    Sellos / caja
                                </div>

                                <div id="sellosCaja"
                                     class="text-lg font-extrabold text-pillone-dark">
                                    0
                                </div>

                            </div>

                            <div class="bg-white rounded-xl p-3 border border-slate-200">

                                <div class="text-[9px] text-slate-400 uppercase">
                                    Unidades / sello
                                </div>

                                <div id="unidadesSello"
                                     class="text-lg font-extrabold text-pillone-dark">
                                    0
                                </div>

                            </div>

                            <div class="bg-white rounded-xl p-3 border border-slate-200">

                                <div class="text-[9px] text-slate-400 uppercase">
                                    Unidades / caja
                                </div>

                                <div id="unidadesCaja"
                                     class="text-lg font-extrabold text-pillone-dark">
                                    0
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="grid md:grid-cols-2 gap-4">

                        <div>

                            <label class="lot-label">
                                Número de lote
                            </label>

                            <input type="text"
                                   name="numeroLote"
                                   required
                                   placeholder="Ej. ABC123"
                                   class="lot-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>

                        <div>

                            <label class="lot-label">
                                Fecha de fabricación
                            </label>

                            <input type="date"
                                   name="fechaFabricacion"
                                   class="lot-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>

                    </div>

                    <div>

                        <label class="lot-label">
                            Fecha de vencimiento
                        </label>

                        <input type="date"
                               name="fechaVencimiento"
                               required
                               class="lot-control w-full px-3.5 py-3 rounded-xl outline-none">

                    </div>

                    <div>

                        <label class="lot-label">
                            ¿Qué recibió?
                        </label>

                        <div class="lot-entry-grid grid grid-cols-3 gap-2">

                            <label class="cursor-pointer">

                                <input type="radio"
                                       name="tipoEntrada"
                                       value="CAJA"
                                       checked
                                       onchange="calcularTotal()"
                                       class="peer hidden">

                                <div class="entry-option">
                                    Cajas
                                </div>

                            </label>

                            <label class="cursor-pointer">

                                <input type="radio"
                                       name="tipoEntrada"
                                       value="SELLO"
                                       onchange="calcularTotal()"
                                       class="peer hidden">

                                <div class="entry-option">
                                    Sellos
                                </div>

                            </label>

                            <label class="cursor-pointer">

                                <input type="radio"
                                       name="tipoEntrada"
                                       value="UNIDAD"
                                       onchange="calcularTotal()"
                                       class="peer hidden">

                                <div class="entry-option">
                                    Unidades
                                </div>

                            </label>

                        </div>

                    </div>

                    <div>

                        <label class="lot-label">
                            Cantidad recibida
                        </label>

                        <input id="cantidadRecibida"
                               type="number"
                               name="cantidadRecibida"
                               min="1"
                               required
                               oninput="calcularTotal()"
                               placeholder="Ej. 5"
                               class="lot-control w-full px-3.5 py-3 rounded-xl outline-none">

                    </div>

                    <div class="rounded-2xl bg-pillone-dark text-white p-5">

                        <div class="text-[10px] uppercase text-white/60 font-bold">
                            Total ingresado al inventario
                        </div>

                        <div class="mt-1">

                            <span id="totalCalculado"
                                  class="text-3xl font-extrabold">
                                0
                            </span>

                            <span class="text-sm text-white/70">
                                unidades
                            </span>

                        </div>

                        <div id="explicacion"
                             class="text-[10px] text-white/60 mt-1">
                        </div>

                    </div>

                </div>

                <div class="lot-actions p-5 border-t border-slate-100 bg-white flex flex-col sm:flex-row sm:justify-end gap-2">

                    <a th:href="${productoId != null ? '/view/lotes?productoId='+productoId : '/view/lotes'}"
                       class="px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold text-center hover:bg-slate-50 transition">

                        Cancelar

                    </a>

                    <button type="submit"
                            class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-pillone-dark text-white font-semibold hover:bg-pillone-darker transition">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>Registrar lote

                    </button>

                </div>

            </form>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>

    function toggleSidebar(){
        document.querySelector('aside').classList.toggle('-translate-x-full');
        document.getElementById('overlay').classList.toggle('hidden');
    }

    function actualizarProducto(){

        const select=
            document.getElementById('producto');

        const resumen=
            document.getElementById('resumenProducto');

        if(!select){
            return;
        }

        const option=
            select.options[
                select.selectedIndex
            ];

        if(!option || !option.value){

            resumen.classList.add('hidden');

            document.getElementById('totalCalculado').textContent='0';
            document.getElementById('explicacion').textContent='';

            return;
        }

        const sellos=
            parseInt(
                option.dataset.sellos || '1'
            );

        const unidadesSello=
            parseInt(
                option.dataset.unidadesSello || '1'
            );

        const unidadesCaja=
            parseInt(
                option.dataset.unidadesCaja || '1'
            );

        document.getElementById('sellosCaja').textContent=
            sellos;

        document.getElementById('unidadesSello').textContent=
            unidadesSello;

        document.getElementById('unidadesCaja').textContent=
            unidadesCaja;

        resumen.classList.remove('hidden');

        calcularTotal();
    }

    function calcularTotal(){

        const select=
            document.getElementById('producto');

        if(!select || !select.value){
            return;
        }

        const option=
            select.options[
                select.selectedIndex
            ];

        const unidadesSello=
            parseInt(
                option.dataset.unidadesSello || '1'
            );

        const unidadesCaja=
            parseInt(
                option.dataset.unidadesCaja || '1'
            );

        const tipo=
            document.querySelector(
                'input[name="tipoEntrada"]:checked'
            );

        const cantidad=
            parseInt(
                document.getElementById('cantidadRecibida').value || '0'
            );

        if(!tipo){
            return;
        }

        let factor=1;

        if(tipo.value==='CAJA'){
            factor=unidadesCaja;
        }

        if(tipo.value==='SELLO'){
            factor=unidadesSello;
        }

        const total=
            cantidad*factor;

        document.getElementById('totalCalculado').textContent=
            total;

        let texto='';

        if(tipo.value==='CAJA'){

            texto=
                cantidad+
                ' caja(s) × '+
                unidadesCaja+
                ' unidades = '+
                total+
                ' unidades';

        }else if(tipo.value==='SELLO'){

            texto=
                cantidad+
                ' sello(s) × '+
                unidadesSello+
                ' unidades = '+
                total+
                ' unidades';

        }else{

            texto=
                cantidad+
                ' unidad(es)';

        }

        document.getElementById('explicacion').textContent=
            texto;
    }

    document.addEventListener(
        'DOMContentLoaded',
        actualizarProducto
    );

</script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
