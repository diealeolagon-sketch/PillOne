<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Nuevo Lote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:['Poppins','sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Nuevo Lote')"></header>

<div class="flex flex-1 relative">

    <div id="overlay"
         onclick="toggleSidebar()"
         class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('productos')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6">

                <a th:href="${productoId != null ? '/view/lotes?productoId='+productoId : '/view/lotes'}"
                   class="text-pillone-accent font-semibold">

                    ← Volver a lotes

                </a>

                <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase mt-3">
                    Registrar entrada de inventario
                </h1>

                <p class="text-xs text-slate-500 mt-1">
                    Selecciona el producto, identifica el lote y registra la mercancía recibida.
                </p>

            </div>

            <div th:if="${error}"
                 class="mb-5 rounded-lg bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                 th:text="${error}">
            </div>

            <form th:action="@{/view/lotes/save}"
                  method="post"
                  class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

                <div class="p-5 md:p-6 space-y-5">

                    <div>

                        <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1.5">
                            Producto
                        </label>

                        <select id="producto"
                                name="idProducto"
                                required
                                onchange="actualizarProducto()"
                                class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-white outline-none focus:border-pillone-accent">

                            <option value="">
                                Seleccione un producto
                            </option>

                            <option th:each="p : ${productos}"
                                    th:value="${p.idProducto}"
                                    th:selected="${productoId != null && productoId == p.idProducto}"
                                    th:attr="
                                        data-sellos=${p.sellosPorCaja != null ? p.sellosPorCaja : 1},
                                        data-unidades-sello=${p.unidadesPorSello != null ? p.unidadesPorSello : 1},
                                        data-unidades-caja=${p.unidadesPorEmpaque != null ? p.unidadesPorEmpaque : 1}
                                    "
                                    th:text="${p.nombreComercial}">
                            </option>

                        </select>

                    </div>

                    <div id="resumenProducto"
                         class="hidden rounded-xl bg-blue-50 border border-blue-100 p-4">

                        <div class="text-[10px] uppercase font-bold text-blue-600 mb-2">
                            Configuración del producto
                        </div>

                        <div class="grid grid-cols-3 gap-2">

                            <div class="bg-white rounded-lg p-3 border border-blue-100">

                                <div class="text-[9px] text-slate-400 uppercase">
                                    Sellos / caja
                                </div>

                                <div id="sellosCaja"
                                     class="text-lg font-extrabold text-pillone-dark">
                                    0
                                </div>

                            </div>

                            <div class="bg-white rounded-lg p-3 border border-blue-100">

                                <div class="text-[9px] text-slate-400 uppercase">
                                    Unidades / sello
                                </div>

                                <div id="unidadesSello"
                                     class="text-lg font-extrabold text-pillone-dark">
                                    0
                                </div>

                            </div>

                            <div class="bg-white rounded-lg p-3 border border-blue-100">

                                <div class="text-[9px] text-slate-400 uppercase">
                                    Unidades / caja
                                </div>

                                <div id="unidadesCaja"
                                     class="text-lg font-extrabold text-pillone-dark">
                                    0
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="grid md:grid-cols-2 gap-4">

                        <div>

                            <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1.5">
                                Número de lote
                            </label>

                            <input type="text"
                                   name="numeroLote"
                                   required
                                   placeholder="Ej. ABC123"
                                   class="w-full px-3 py-2.5 rounded-lg border border-slate-200 outline-none focus:border-pillone-accent">

                        </div>

                        <div>

                            <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1.5">
                                Fecha de fabricación
                            </label>

                            <input type="date"
                                   name="fechaFabricacion"
                                   class="w-full px-3 py-2.5 rounded-lg border border-slate-200 outline-none focus:border-pillone-accent">

                        </div>

                    </div>

                    <div>

                        <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1.5">
                            Fecha de vencimiento
                        </label>

                        <input type="date"
                               name="fechaVencimiento"
                               required
                               class="w-full px-3 py-2.5 rounded-lg border border-slate-200 outline-none focus:border-pillone-accent">

                    </div>

                    <div>

                        <label class="block text-[10px] uppercase font-bold text-slate-500 mb-2">
                            ¿Qué recibió?
                        </label>

                        <div class="grid grid-cols-3 gap-2">

                            <label class="cursor-pointer">

                                <input type="radio"
                                       name="tipoEntrada"
                                       value="CAJA"
                                       checked
                                       onchange="calcularTotal()"
                                       class="peer hidden">

                                <div class="text-center border rounded-lg p-3 peer-checked:border-pillone-accent peer-checked:bg-blue-50 peer-checked:text-pillone-accent font-semibold">
                                    Cajas
                                </div>

                            </label>

                            <label class="cursor-pointer">

                                <input type="radio"
                                       name="tipoEntrada"
                                       value="SELLO"
                                       onchange="calcularTotal()"
                                       class="peer hidden">

                                <div class="text-center border rounded-lg p-3 peer-checked:border-pillone-accent peer-checked:bg-blue-50 peer-checked:text-pillone-accent font-semibold">
                                    Sellos
                                </div>

                            </label>

                            <label class="cursor-pointer">

                                <input type="radio"
                                       name="tipoEntrada"
                                       value="UNIDAD"
                                       onchange="calcularTotal()"
                                       class="peer hidden">

                                <div class="text-center border rounded-lg p-3 peer-checked:border-pillone-accent peer-checked:bg-blue-50 peer-checked:text-pillone-accent font-semibold">
                                    Unidades
                                </div>

                            </label>

                        </div>

                    </div>

                    <div>

                        <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1.5">
                            Cantidad recibida
                        </label>

                        <input id="cantidadRecibida"
                               type="number"
                               name="cantidadRecibida"
                               min="1"
                               required
                               oninput="calcularTotal()"
                               placeholder="Ej. 5"
                               class="w-full px-3 py-2.5 rounded-lg border border-slate-200 outline-none focus:border-pillone-accent">

                    </div>

                    <div class="rounded-xl bg-pillone-dark text-white p-4">

                        <div class="text-[10px] uppercase text-white/60 font-bold">
                            Total ingresado al inventario
                        </div>

                        <div class="mt-1">

                            <span id="totalCalculado"
                                  class="text-3xl font-extrabold">
                                0
                            </span>

                            <span class="text-sm text-white/70">
                                unidades
                            </span>

                        </div>

                        <div id="explicacion"
                             class="text-[10px] text-white/60 mt-1">
                        </div>

                    </div>

                </div>

                <div class="p-5 border-t bg-slate-50 flex flex-col sm:flex-row sm:justify-end gap-2">

                    <a th:href="${productoId != null ? '/view/lotes?productoId='+productoId : '/view/lotes'}"
                       class="px-4 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-600 font-semibold text-center">

                        Cancelar

                    </a>

                    <button type="submit"
                            class="px-5 py-2.5 rounded-lg bg-pillone-accent text-white font-bold">

                        Registrar Lote

                    </button>

                </div>

            </form>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>

    function toggleSidebar(){
        document.querySelector('aside').classList.toggle('-translate-x-full');
        document.getElementById('overlay').classList.toggle('hidden');
    }

    function actualizarProducto(){

        const select=
            document.getElementById('producto');

        const resumen=
            document.getElementById('resumenProducto');

        if(!select){
            return;
        }

        const option=
            select.options[
                select.selectedIndex
            ];

        if(!option || !option.value){

            resumen.classList.add('hidden');

            document.getElementById('totalCalculado').textContent='0';
            document.getElementById('explicacion').textContent='';

            return;
        }

        const sellos=
            parseInt(
                option.dataset.sellos || '1'
            );

        const unidadesSello=
            parseInt(
                option.dataset.unidadesSello || '1'
            );

        const unidadesCaja=
            parseInt(
                option.dataset.unidadesCaja || '1'
            );

        document.getElementById('sellosCaja').textContent=
            sellos;

        document.getElementById('unidadesSello').textContent=
            unidadesSello;

        document.getElementById('unidadesCaja').textContent=
            unidadesCaja;

        resumen.classList.remove('hidden');

        calcularTotal();
    }

    function calcularTotal(){

        const select=
            document.getElementById('producto');

        if(!select || !select.value){
            return;
        }

        const option=
            select.options[
                select.selectedIndex
            ];

        const unidadesSello=
            parseInt(
                option.dataset.unidadesSello || '1'
            );

        const unidadesCaja=
            parseInt(
                option.dataset.unidadesCaja || '1'
            );

        const tipo=
            document.querySelector(
                'input[name="tipoEntrada"]:checked'
            );

        const cantidad=
            parseInt(
                document.getElementById('cantidadRecibida').value || '0'
            );

        if(!tipo){
            return;
        }

        let factor=1;

        if(tipo.value==='CAJA'){
            factor=unidadesCaja;
        }

        if(tipo.value==='SELLO'){
            factor=unidadesSello;
        }

        const total=
            cantidad*factor;

        document.getElementById('totalCalculado').textContent=
            total;

        let texto='';

        if(tipo.value==='CAJA'){

            texto=
                cantidad+
                ' caja(s) × '+
                unidadesCaja+
                ' unidades = '+
                total+
                ' unidades';

        }else if(tipo.value==='SELLO'){

            texto=
                cantidad+
                ' sello(s) × '+
                unidadesSello+
                ' unidades = '+
                total+
                ' unidades';

        }else{

            texto=
                cantidad+
                ' unidad(es)';

        }

        document.getElementById('explicacion').textContent=
            texto;
    }

    document.addEventListener(
        'DOMContentLoaded',
        actualizarProducto
    );

</script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
