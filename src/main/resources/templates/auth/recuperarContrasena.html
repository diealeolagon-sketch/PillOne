<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Recuperar contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{pillone:{bg:'#F7F7FF',dark:'#07004D',accent:'#208AAE'}},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>

    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
        }
        .auth-shell{
            background:
                radial-gradient(circle at top right,rgba(32,138,174,.08),transparent 30rem),
                radial-gradient(circle at bottom left,rgba(7,0,77,.05),transparent 26rem),
                var(--pillone-bg);
        }
        .auth-card{
            background:rgba(255,255,255,.98);
            border:1px solid #E7E9F0;
            box-shadow:0 18px 50px rgba(7,0,77,.09);
        }
        .brand-panel{
            background:linear-gradient(145deg,var(--pillone-dark),var(--pillone-darker));
            border:1px solid rgba(255,255,255,.08);
            box-shadow:0 18px 42px rgba(7,0,77,.16);
        }
        .auth-control{
            border:1px solid #E7E9F0;
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .auth-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        @media(max-width:640px){
            .brand-panel{border-radius:1.15rem;}
            .auth-card{border-radius:1.15rem;}
        }
    </style>

</head>
<body class="auth-shell min-h-screen bg-pillone-bg font-sans flex items-center justify-center p-4 sm:p-6">
<div class="w-full max-w-md">
    <div class="brand-panel rounded-2xl px-5 py-5 mb-4 flex items-center justify-center overflow-hidden">
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 460 110"
             class="h-14 sm:h-16 w-auto">

            <defs>

                <linearGradient id="hdrBlue"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="100%">

                    <stop offset="0%" stop-color="#208AAE"/>
                    <stop offset="100%" stop-color="#07004D"/>

                </linearGradient>

                <linearGradient id="hdrGreen"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="100%">

                    <stop offset="0%" stop-color="#34D399"/>
                    <stop offset="100%" stop-color="#10B981"/>

                </linearGradient>

            </defs>

            <g>

                <path d="M8 8L8 92C8 96.4 11.6 100 16 100C20.4 100 24 96.4 24 92L24 60L48 60C64 60 76 48 76 34C76 20 64 8 48 8ZM24 22H46C53 22 58 27 58 34C58 41 53 46 46 46H24Z"
                      fill="#FFFFFF"/>

                <g transform="translate(70,4)">

                    <path d="M16 48V16A16 16 0 0132 0H44A16 16 0 0160 16V48Z"
                          fill="url(#hdrBlue)"/>

                    <path d="M16 48H60V80A16 16 0 0144 96H32A16 16 0 0116 80Z"
                          fill="url(#hdrGreen)"/>

                    <line x1="16"
                          y1="48"
                          x2="60"
                          y2="48"
                          stroke="#FFFFFF"
                          stroke-width="2.5"/>

                    <path d="M38 20V76"
                          stroke="#FFFFFF"
                          stroke-width="6"
                          stroke-linecap="round"/>

                    <path d="M28 30L38 20"
                          fill="none"
                          stroke="#FFFFFF"
                          stroke-width="5"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>

                </g>

            </g>

            <g transform="translate(145,12)">

                <text x="0"
                      y="44"
                      font-family="'Poppins',sans-serif"
                      font-weight="700"
                      font-size="44"
                      fill="#FFFFFF"
                      letter-spacing="-1">

                    Pill<tspan fill="#208AAE">One</tspan>

                </text>

                <rect x="0"
                      y="56"
                      width="280"
                      height="22"
                      rx="11"
                      fill="#FFFFFF"
                      opacity=".1"/>

                <text x="10"
                      y="71"
                      font-family="'Poppins',sans-serif"
                      font-weight="600"
                      font-size="9"
                      fill="#34D399"
                      letter-spacing="1.1">

                    EL NÚMERO UNO EN CONTROL FARMACÉUTICO

                </text>

            </g>

        </svg>
    </div>
    <section class="auth-card rounded-2xl p-6 sm:p-8">
        <div class="w-12 h-12 rounded-xl bg-pillone-accent/10 text-pillone-accent flex items-center justify-center mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg>
        </div>
        <h1 class="text-xl font-extrabold text-pillone-dark">Recuperar contraseña</h1>
        <p class="text-xs text-slate-500 mt-1 mb-5">Escribe tu usuario o correo. Enviaremos un enlace al correo registrado del empleado.</p>
        <div th:if="${mensaje}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-xs text-emerald-700" th:text="${mensaje}"></div>
        <form th:action="@{/recuperar-contrasena}" method="post" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Usuario o correo</label>
                <input name="identificador" required class="auth-control w-full px-3.5 py-3 rounded-xl outline-none" placeholder="usuario o correo@empresa.com">
            </div>
            <button class="w-full py-3 rounded-xl bg-pillone-dark text-white font-bold">Enviar enlace de recuperación</button>
        </form>
        <a th:href="@{/login}" class="mt-5 inline-flex items-center gap-1 text-xs font-semibold text-pillone-accent"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>Volver al login</a>
    </section>
</div>
</body>
</html>
