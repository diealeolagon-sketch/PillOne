<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config={theme:{extend:{colors:{pillone:{bg:'#F7F7FF',dark:'#07004D',darker:'#04002C',accent:'#208AAE',text:'#1D1E18'}},fontFamily:{sans:['Poppins','sans-serif']}}}}
    </script>
</head>
<body class="min-h-screen bg-pillone-bg font-sans text-pillone-text flex items-center justify-center p-4">
<div class="w-full max-w-md">
    <div class="text-center mb-6">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-pillone-dark flex items-center justify-center shadow-lg">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 3h8a4 4 0 014 4v10a4 4 0 01-4 4H8a4 4 0 01-4-4V7a4 4 0 014-4zM8 12h8M12 8v8"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-pillone-dark mt-4">PillOne</h1>
        <p class="text-sm text-slate-500 mt-1">Control farmacéutico</p>
    </div>

    <section class="bg-white border border-slate-200 rounded-2xl shadow-xl p-6 sm:p-8">
        <h2 class="text-lg font-extrabold text-pillone-dark">Iniciar sesión</h2>
        <p class="text-xs text-slate-500 mt-1 mb-5">Ingresa con tu usuario o con el correo registrado en tu perfil de empleado.</p>

        <div th:if="${error}" class="mb-4 rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700" th:text="${error}"></div>
        <div th:if="${param.logout}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-xs text-emerald-700">Sesión cerrada correctamente.</div>
        <div th:if="${param.reset}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-xs text-emerald-700">Contraseña actualizada. Ya puedes ingresar.</div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Usuario o correo</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 00-16 0m8-10a4 4 0 100-8 4 4 0 000 8z"/></svg>
                    <input name="login" th:value="${login}" required autocomplete="username" class="w-full pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent focus:bg-white" placeholder="usuario o correo@empresa.com">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Contraseña</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path stroke-linecap="round" d="M8 10V7a4 4 0 018 0v3"/></svg>
                    <input id="password" type="password" name="password" required autocomplete="current-password" class="w-full pl-10 pr-11 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent focus:bg-white" placeholder="••••••••">
                    <button type="button" onclick="verPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-pillone-accent">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="flex justify-end">
                <a th:href="@{/recuperar-contrasena}" class="text-xs font-semibold text-pillone-accent hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <button class="w-full py-3 rounded-xl bg-pillone-dark text-white font-bold hover:bg-pillone-darker transition">Ingresar</button>
        </form>
    </section>
</div>
<script>
function verPassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';}
</script>
</body>
</html>
