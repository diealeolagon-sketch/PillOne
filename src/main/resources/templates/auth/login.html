<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config={theme:{extend:{colors:{pillone:{bg:'#F7F7FF',dark:'#07004D',darker:'#04002C',accent:'#208AAE',text:'#1D1E18'}},fontFamily:{sans:['Poppins','sans-serif']}}}}
    </script>

    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
        }
        .auth-shell{
            background:
                radial-gradient(circle at top right,rgba(32,138,174,.08),transparent 30rem),
                radial-gradient(circle at bottom left,rgba(7,0,77,.05),transparent 26rem),
                var(--pillone-bg);
        }
        .auth-card{
            background:rgba(255,255,255,.98);
            border:1px solid #E7E9F0;
            box-shadow:0 18px 50px rgba(7,0,77,.09);
        }
        .brand-panel{
            background:linear-gradient(145deg,var(--pillone-dark),var(--pillone-darker));
            border:1px solid rgba(255,255,255,.08);
            box-shadow:0 18px 42px rgba(7,0,77,.16);
        }
        .auth-control{
            border:1px solid #E7E9F0;
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .auth-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        @media(max-width:640px){
            .brand-panel{border-radius:1.15rem;}
            .auth-card{border-radius:1.15rem;}
        }
    </style>

</head>
<body class="auth-shell min-h-screen font-sans text-pillone-text flex items-center justify-center p-4 sm:p-6">
<div class="w-full max-w-md">
    <div class="brand-panel rounded-2xl px-5 py-5 sm:px-7 sm:py-6 mb-4 flex items-center justify-center overflow-hidden">
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 460 110"
             class="h-14 sm:h-16 w-auto">

            <defs>

                <linearGradient id="hdrBlue"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="100%">

                    <stop offset="0%" stop-color="#208AAE"/>
                    <stop offset="100%" stop-color="#07004D"/>

                </linearGradient>

                <linearGradient id="hdrGreen"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="100%">

                    <stop offset="0%" stop-color="#34D399"/>
                    <stop offset="100%" stop-color="#10B981"/>

                </linearGradient>

            </defs>

            <g>

                <path d="M8 8L8 92C8 96.4 11.6 100 16 100C20.4 100 24 96.4 24 92L24 60L48 60C64 60 76 48 76 34C76 20 64 8 48 8ZM24 22H46C53 22 58 27 58 34C58 41 53 46 46 46H24Z"
                      fill="#FFFFFF"/>

                <g transform="translate(70,4)">

                    <path d="M16 48V16A16 16 0 0132 0H44A16 16 0 0160 16V48Z"
                          fill="url(#hdrBlue)"/>

                    <path d="M16 48H60V80A16 16 0 0144 96H32A16 16 0 0116 80Z"
                          fill="url(#hdrGreen)"/>

                    <line x1="16"
                          y1="48"
                          x2="60"
                          y2="48"
                          stroke="#FFFFFF"
                          stroke-width="2.5"/>

                    <path d="M38 20V76"
                          stroke="#FFFFFF"
                          stroke-width="6"
                          stroke-linecap="round"/>

                    <path d="M28 30L38 20"
                          fill="none"
                          stroke="#FFFFFF"
                          stroke-width="5"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>

                </g>

            </g>

            <g transform="translate(145,12)">

                <text x="0"
                      y="44"
                      font-family="'Poppins',sans-serif"
                      font-weight="700"
                      font-size="44"
                      fill="#FFFFFF"
                      letter-spacing="-1">

                    Pill<tspan fill="#208AAE">One</tspan>

                </text>

                <rect x="0"
                      y="56"
                      width="280"
                      height="22"
                      rx="11"
                      fill="#FFFFFF"
                      opacity=".1"/>

                <text x="10"
                      y="71"
                      font-family="'Poppins',sans-serif"
                      font-weight="600"
                      font-size="9"
                      fill="#34D399"
                      letter-spacing="1.1">

                    EL NÚMERO UNO EN CONTROL FARMACÉUTICO

                </text>

            </g>

        </svg>
    </div>

    <section class="auth-card rounded-2xl p-6 sm:p-8">
        <h2 class="text-lg font-extrabold text-pillone-dark">Iniciar sesión</h2>
        <p class="text-xs text-slate-500 mt-1 mb-5">Ingresa con tu usuario o con el correo registrado en tu perfil de empleado.</p>

        <div th:if="${error}" class="mb-4 rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700" th:text="${error}"></div>
        <div th:if="${param.logout}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-xs text-emerald-700">Sesión cerrada correctamente.</div>
        <div th:if="${param.reset}" class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-xs text-emerald-700">Contraseña actualizada. Ya puedes ingresar.</div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Usuario o correo</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 00-16 0m8-10a4 4 0 100-8 4 4 0 000 8z"/></svg>
                    <input name="login" th:value="${login}" required autocomplete="username" class="auth-control w-full pl-10 pr-3 py-3 rounded-xl outline-none" placeholder="usuario o correo@empresa.com">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Contraseña</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path stroke-linecap="round" d="M8 10V7a4 4 0 018 0v3"/></svg>
                    <input id="password" type="password" name="password" required autocomplete="current-password" class="auth-control w-full pl-10 pr-11 py-3 rounded-xl outline-none" placeholder="••••••••">
                    <button type="button" onclick="verPassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-pillone-accent">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="flex justify-end">
                <a th:href="@{/recuperar-contrasena}" class="text-xs font-semibold text-pillone-accent hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <button class="w-full py-3 rounded-xl bg-pillone-dark text-white font-bold hover:bg-pillone-darker transition">Ingresar</button>
        </form>
    </section>
</div>
<script>
    function verPassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';}
</script>
</body>
</html>
