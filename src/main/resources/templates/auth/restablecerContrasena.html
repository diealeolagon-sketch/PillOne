<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Nueva contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{pillone:{bg:'#F7F7FF',dark:'#07004D',accent:'#208AAE'}},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>
</head>
<body class="min-h-screen bg-pillone-bg font-sans flex items-center justify-center p-4">
<section class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl p-6 sm:p-8">
    <h1 class="text-xl font-extrabold text-pillone-dark">Crear nueva contraseña</h1>
    <p class="text-xs text-slate-500 mt-1 mb-5">Usa mínimo 8 caracteres.</p>
    <div th:if="${error}" class="mb-4 rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700" th:text="${error}"></div>

    <div th:if="${tokenInvalido}" class="space-y-4">
        <a th:href="@{/recuperar-contrasena}" class="block text-center w-full py-3 rounded-xl bg-pillone-dark text-white font-bold">Solicitar un nuevo enlace</a>
    </div>

    <form th:unless="${tokenInvalido}" th:action="@{/restablecer-contrasena}" method="post" class="space-y-4">
        <input type="hidden" name="token" th:value="${token}">
        <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Nueva contraseña</label>
            <input type="password" name="password" required minlength="8" class="w-full px-3.5 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">
        </div>
        <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Confirmar contraseña</label>
            <input type="password" name="confirmarPassword" required minlength="8" class="w-full px-3.5 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">
        </div>
        <button class="w-full py-3 rounded-xl bg-pillone-dark text-white font-bold">Guardar nueva contraseña</button>
    </form>
</section>
</body>
</html>
