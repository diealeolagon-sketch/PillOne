<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pill One - Formulario de Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F7F7FF; color: #1D1E18; }
    </style>
</head>
<body class="bg-[#F7F7FF] font-sans text-[#1D1E18] antialiased min-h-screen flex flex-col">

<!-- TOPBAR -->
<div th:replace="layout :: topbar('Clientes')"></div>

<!-- CONTENEDOR CENTRAL (Sidebar + Área Principal) -->
<div class="flex flex-1 relative">

    <!-- SIDEBAR -->
    <div th:replace="layout :: sidebar('clientes')"></div>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-extrabold text-[#07004D] uppercase">
                            <span th:text="${cliente.id_cliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'">Gestión de Cliente</span>
                        </h1>
                        <p class="text-sm text-slate-500 mt-1">
                            Complete los campos requeridos para almacenar la información del paciente.
                        </p>
                    </div>
                    <div>
                        <a th:href="@{/view/clientes}"
                           class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 transition">
                            ← Volver
                        </a>
                    </div>
                </div>
            </section>

            <!-- FORMULARIO -->
            <section class="rounded-xl border border-slate-200 bg-white shadow-sm p-6 md:p-8">
                <form th:action="@{/view/clientes/save}" th:object="${cliente}" method="post" class="space-y-6">

                    <input type="hidden" th:field="*{id_cliente}" />

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Tipo de Documento</label>
                            <select th:field="*{tipoDocumento}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                                <option value="CC">Cédula de Ciudadanía (CC)</option>
                                <option value="CE">Cédula de Extranjería (CE)</option>
                                <option value="PASAPORTE">Pasaporte</option>
                                <option value="TI">Tarjeta de Identidad (TI)</option>
                                <option value="NIT">NIT</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Número de Documento</label>
                            <input type="text" th:field="*{numeroDocumento}" required placeholder="Ej. 1114829301"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nombre Completo</label>
                            <input type="text" th:field="*{nombreCompleto}" required placeholder="Nombres y Apellidos"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Teléfono</label>
                            <input type="text" th:field="*{telefono}" placeholder="Ej. 3157894512"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Correo Electrónico</label>
                            <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Dirección</label>
                            <input type="text" th:field="*{direccion}" placeholder="Calle 25 # 14-30"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">EPS / Entidad de Salud</label>
                            <input type="text" th:field="*{eps}" placeholder="Ej. Sura, Sanitas, Nueva EPS"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Alergias Conocidas</label>
                            <input type="text" th:field="*{alergias}" placeholder="Ej. Penicilina, Ibuprofeno"
                                   class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#208AAE] focus:ring-2 focus:ring-sky-100">
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                        <a th:href="@{/view/clientes}"
                           class="rounded-lg bg-slate-100 px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">
                            Cancelar
                        </a>
                        <button type="submit"
                                class="rounded-lg bg-[#208AAE] px-6 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-sky-700 transition">
                            Guardar Cliente
                        </button>
                    </div>

                </form>
            </section>

        </main>

        <!-- FOOTER -->
        <div th:replace="layout :: footer"></div>
    </div>

</div>

</body>
</html>
