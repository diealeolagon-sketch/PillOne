<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Clientes</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:['Poppins','sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-soft:#FAFBFE;
            --ui-muted:#667085;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .clients-shell{
            background:
                radial-gradient(circle at top right,rgba(32,138,174,.055),transparent 28rem),
                var(--pillone-bg);
        }
        .clients-panel{
            background:rgba(255,255,255,.98);
            border:1px solid var(--ui-border);
            box-shadow:var(--ui-shadow);
        }
        .clients-control{
            border:1px solid var(--ui-border);
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .clients-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        .client-row{
            transition:background .15s ease,box-shadow .15s ease;
        }
        .client-row:hover{
            background:#FAFBFE;
            box-shadow:inset 3px 0 0 rgba(32,138,174,.5);
        }
        .clients-pagination{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            padding:.9rem 1rem;
            border-top:1px solid var(--ui-border);
            background:#fff;
        }
        .page-controls{
            display:flex;
            align-items:center;
            gap:.35rem;
        }
        .page-btn{
            min-width:2.25rem;
            height:2.25rem;
            padding:0 .7rem;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:1px solid var(--ui-border);
            border-radius:.65rem;
            background:#fff;
            color:#475467;
            font-size:.72rem;
            font-weight:600;
        }
        .page-btn.active{
            background:var(--pillone-dark);
            color:#fff;
            border-color:var(--pillone-dark);
        }
        .page-btn:disabled{
            opacity:.4;
            cursor:not-allowed;
        }
        @media(max-width:767px){
            .clients-main{padding:1rem!important;}
            .clients-header{align-items:stretch!important;}
            .clients-actions{display:grid!important;grid-template-columns:1fr 1fr;width:100%;}
            .clients-actions a{width:100%;}
            .clients-toolbar{
                position:sticky;
                top:0;
                z-index:6;
                background:rgba(255,255,255,.96);
                backdrop-filter:blur(10px);
            }
            #buscar{font-size:16px!important;}
            .clients-table-wrap{
                overflow:visible!important;
                padding:.75rem;
                background:#F7F7FF;
            }
            .clients-table,
            .clients-table tbody{
                display:block;
                width:100%;
                min-width:0!important;
            }
            .clients-table thead{display:none;}
            .clients-table tbody{border:0!important;}
            .clients-table .fila-cliente{
                display:block;
                background:#fff;
                border:1px solid var(--ui-border);
                border-radius:1rem;
                margin-bottom:.7rem;
                overflow:hidden;
                box-shadow:0 6px 18px rgba(7,0,77,.04);
            }
            .clients-table .fila-cliente td{
                display:flex;
                align-items:flex-start;
                justify-content:space-between;
                gap:1rem;
                padding:.68rem .85rem!important;
                text-align:right!important;
                border:0;
            }
            .clients-table .fila-cliente td::before{
                content:attr(data-label);
                flex:0 0 5.8rem;
                text-align:left;
                color:#98A2B3;
                font-size:.62rem;
                font-weight:700;
                text-transform:uppercase;
            }
            .clients-table .fila-cliente td:first-child{
                display:block;
                text-align:left!important;
                background:#FCFCFE;
                border-bottom:1px solid #F0F1F5;
            }
            .clients-table .fila-cliente td:first-child::before{display:none;}
            .clients-table .fila-cliente td:last-child{
                display:block;
                border-top:1px solid #F0F1F5;
            }
            .clients-table .fila-cliente td:last-child::before{
                display:block;
                margin-bottom:.5rem;
            }
            .clients-table .fila-cliente td:last-child>div{
                justify-content:flex-end!important;
                flex-wrap:wrap;
            }
            .clients-pagination{
                position:sticky;
                bottom:0;
                z-index:5;
                flex-direction:column;
                align-items:stretch;
                gap:.55rem;
                padding:.75rem;
                background:rgba(255,255,255,.97);
                backdrop-filter:blur(10px);
            }
            .page-controls{justify-content:center;}
            #paginacion-info{text-align:center;}
        }
    </style>

</head>

<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Gestión de Clientes')"></header>

<div class="flex flex-1 relative clients-shell">

    <div id="overlay"
         onclick="toggleSidebar()"
         class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('clientes')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="clients-main flex-1 p-4 sm:p-6 lg:p-8 max-w-[1450px] mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5">

                <div class="clients-header flex flex-col md:flex-row md:items-start md:justify-between gap-4">

                    <div>

                        <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark">
                            Clientes
                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Consulte pacientes, información personal, historial y fórmulas médicas.
                        </p>

                    </div>

                    <!-- BOTONES GENERALES -->
                    <div class="clients-actions flex flex-wrap gap-2">

                        <!-- NUEVA FORMULA GENERAL -->
                        <a th:href="@{/view/formulas/form}"
                           class="inline-flex items-center justify-center gap-2 rounded-xl bg-white border border-slate-200 px-4 py-2.5 text-xs font-semibold text-pillone-dark hover:bg-slate-50 transition">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z">
                                </path>

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M14 2v6h6M12 12v6M9 15h6">
                                </path>

                            </svg>

                            Nueva fórmula

                        </a>

                        <!-- NUEVO CLIENTE -->
                        <a th:href="@{/view/clientes/form}"
                           class="inline-flex items-center justify-center gap-2 rounded-xl bg-pillone-dark px-4 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-pillone-darker transition">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 4v16m8-8H4">
                                </path>

                            </svg>

                            Nuevo cliente

                        </a>

                    </div>

                </div>

                <div id="paginacion-clientes" class="clients-pagination hidden">
                    <div id="paginacion-info" class="text-[11px] text-slate-500">Mostrando 0 de 0 clientes</div>
                    <div class="page-controls">
                        <button type="button" id="pagina-anterior" class="page-btn" onclick="cambiarPagina(-1)" aria-label="Página anterior">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <div id="numeros-pagina" class="page-controls"></div>
                        <button type="button" id="pagina-siguiente" class="page-btn" onclick="cambiarPagina(1)" aria-label="Página siguiente">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

            </section>

            <!-- MENSAJES -->
            <div th:if="${mensaje}"
                 class="mb-4 rounded-lg bg-emerald-50 border border-emerald-200 p-3 text-emerald-800 font-medium"
                 th:text="${mensaje}">
            </div>

            <div th:if="${error}"
                 class="mb-4 rounded-lg bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                 th:text="${error}">
            </div>

            <!-- TABLA -->
            <section class="clients-panel rounded-2xl overflow-hidden">

                <!-- BUSCADOR -->
                <div class="clients-toolbar p-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

                    <div class="relative w-full sm:w-96">

                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z">
                                </path>

                            </svg>

                        </span>

                        <input type="text"
                               id="buscar"
                               oninput="filtrar()"
                               placeholder="Buscar cliente, documento, teléfono o EPS..."
                               class="clients-control w-full pl-9 pr-3 py-2.5 rounded-xl outline-none">

                    </div>

                    <div class="text-slate-500">

                        Total:

                        <strong id="contador"
                                class="text-pillone-dark"
                                th:text="${#lists.size(clientes)}">
                            0
                        </strong>

                    </div>

                </div>

                <div class="clients-table-wrap overflow-x-auto">

                    <table class="clients-table min-w-full text-xs text-left">

                        <thead>

                        <tr class="bg-pillone-dark text-white uppercase text-[10px] tracking-wider">

                            <th class="px-4 py-3">
                                Cliente
                            </th>

                            <th class="px-4 py-3">
                                Documento
                            </th>

                            <th class="px-4 py-3">
                                Contacto
                            </th>

                            <th class="px-4 py-3">
                                EPS
                            </th>

                            <th class="px-4 py-3">
                                Alergias
                            </th>

                            <th class="px-4 py-3 text-center">
                                Acciones
                            </th>

                        </tr>

                        </thead>

                        <tbody class="divide-y divide-slate-100">

                        <!-- SIN CLIENTES -->
                        <tr th:if="${#lists.isEmpty(clientes)}">

                            <td colspan="6"
                                class="p-10 text-center text-slate-400">

                                No hay clientes registrados.

                            </td>

                        </tr>

                        <!-- CLIENTES -->
                        <tr th:each="cliente : ${clientes}"
                            class="fila-cliente client-row">

                            <!-- CLIENTE -->
                            <td class="px-4 py-3">

                                <div class="font-bold text-slate-800"
                                     th:text="${cliente.nombreCompleto}">
                                    Cliente
                                </div>

                                <div class="text-[10px] text-slate-400"
                                     th:text="${cliente.correo != null ? cliente.correo : ''}">
                                </div>

                            </td>

                            <!-- DOCUMENTO -->
                            <td class="px-4 py-3">

                                <div class="font-semibold"
                                     th:text="${cliente.tipoDocumento != null ? cliente.tipoDocumento : '-'}">
                                </div>

                                <div class="text-[10px] text-slate-400"
                                     th:text="${cliente.numeroDocumento}">
                                </div>

                            </td>

                            <!-- CONTACTO -->
                            <td class="px-4 py-3">

                                <div th:text="${cliente.telefono != null && !cliente.telefono.isEmpty() ? cliente.telefono : '-'}">
                                </div>

                                <div class="text-[10px] text-slate-400"
                                     th:text="${cliente.direccion != null ? cliente.direccion : ''}">
                                </div>

                            </td>

                            <!-- EPS -->
                            <td class="px-4 py-3"
                                th:text="${cliente.eps != null && !cliente.eps.isEmpty() ? cliente.eps : '-'}">
                            </td>

                            <!-- ALERGIAS -->
                            <td class="px-4 py-3">

                                <span th:if="${cliente.alergias != null && !cliente.alergias.isEmpty()}"
                                      class="inline-flex px-2 py-1 rounded-lg bg-red-50 text-red-700 font-semibold"
                                      th:text="${cliente.alergias}">
                                </span>

                                <span th:unless="${cliente.alergias != null && !cliente.alergias.isEmpty()}"
                                      class="text-slate-400">

                                    Sin registro

                                </span>

                            </td>

                            <!-- ACCIONES -->
                            <td class="px-4 py-3">

                                <div class="flex items-center justify-center gap-2">

                                    <!-- VER -->
                                    <a th:href="@{/view/clientes/ver/{id}(id=${cliente.id_cliente})}"
                                       class="p-2 rounded-lg bg-slate-50 text-slate-500 hover:bg-pillone-dark hover:text-white transition"
                                       title="Ver cliente">

                                        <svg class="w-4 h-4"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.8"
                                             viewBox="0 0 24 24">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12z">
                                            </path>

                                            <circle cx="12"
                                                    cy="12"
                                                    r="3">
                                            </circle>

                                        </svg>

                                    </a>

                                    <!-- FORMULA DEL CLIENTE -->
                                    <a th:href="@{/view/formulas/form(cliente=${cliente.id_cliente})}"
                                       class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-pillone-accent/10 text-pillone-accent font-bold hover:bg-pillone-accent hover:text-white transition"
                                       title="Crear fórmula médica">

                                        <svg class="w-4 h-4"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.8"
                                             viewBox="0 0 24 24">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z">
                                            </path>

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M14 2v6h6M12 12v6M9 15h6">
                                            </path>

                                        </svg>

                                        Fórmula

                                    </a>

                                    <!-- EDITAR -->
                                    <a th:href="@{/view/clientes/edit/{id}(id=${cliente.id_cliente})}"
                                       class="p-2 rounded-lg bg-slate-50 text-slate-500 hover:bg-pillone-accent/10 hover:text-pillone-accent transition"
                                       title="Editar cliente">

                                        <svg class="w-4 h-4"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.8"
                                             viewBox="0 0 24 24">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M15.232 5.232l3.536 3.536M4 20l4.5-1 10.268-10.268a2.5 2.5 0 10-3.536-3.536L4.964 15.464 4 20z">
                                            </path>

                                        </svg>

                                    </a>

                                </div>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>
    let paginaActual=1;
    let filasPorPagina=window.innerWidth<768?5:10;
    let filasFiltradas=[];

    function obtenerFilas(){
        return Array.from(document.querySelectorAll('.fila-cliente'));
    }

    function filtrar(){
        const q=document.getElementById('buscar').value.toLowerCase().trim();
        filasFiltradas=obtenerFilas().filter(fila=>
            !q || fila.textContent.toLowerCase().includes(q)
        );
        paginaActual=1;
        renderizarPagina();
    }

    function renderizarPagina(){
        const todas=obtenerFilas();
        const total=filasFiltradas.length;
        const totalPaginas=Math.max(1,Math.ceil(total/filasPorPagina));
        if(paginaActual>totalPaginas) paginaActual=totalPaginas;

        const inicio=(paginaActual-1)*filasPorPagina;
        const fin=Math.min(inicio+filasPorPagina,total);

        todas.forEach(f=>f.style.display='none');
        filasFiltradas.slice(inicio,fin).forEach(f=>f.style.display='');

        document.getElementById('contador').textContent=total;
        actualizarPaginacion(total,totalPaginas,inicio,fin);
    }

    function actualizarPaginacion(total,totalPaginas,inicio,fin){
        const cont=document.getElementById('paginacion-clientes');
        const info=document.getElementById('paginacion-info');
        const nums=document.getElementById('numeros-pagina');
        const anterior=document.getElementById('pagina-anterior');
        const siguiente=document.getElementById('pagina-siguiente');

        if(total===0){
            cont.classList.add('hidden');
            return;
        }

        cont.classList.remove('hidden');
        info.textContent=`Mostrando ${inicio+1}–${fin} de ${total} clientes`;
        anterior.disabled=paginaActual===1;
        siguiente.disabled=paginaActual===totalPaginas;
        nums.innerHTML='';

        obtenerPaginasVisibles(totalPaginas,paginaActual).forEach(p=>{
            if(p==='...'){
                const span=document.createElement('span');
                span.className='page-btn border-transparent bg-transparent pointer-events-none';
                span.textContent='…';
                nums.appendChild(span);
                return;
            }
            const b=document.createElement('button');
            b.type='button';
            b.className='page-btn'+(p===paginaActual?' active':'');
            b.textContent=p;
            b.onclick=()=>irAPagina(p);
            nums.appendChild(b);
        });
    }

    function obtenerPaginasVisibles(total,actual){
        if(total<=5) return Array.from({length:total},(_,i)=>i+1);
        if(actual<=3) return [1,2,3,4,'...',total];
        if(actual>=total-2) return [1,'...',total-3,total-2,total-1,total];
        return [1,'...',actual-1,actual,actual+1,'...',total];
    }

    function irAPagina(p){
        paginaActual=p;
        renderizarPagina();
        if(window.innerWidth<768){
            document.getElementById('buscar').scrollIntoView({behavior:'smooth',block:'start'});
        }
    }

    function cambiarPagina(delta){
        const totalPaginas=Math.max(1,Math.ceil(filasFiltradas.length/filasPorPagina));
        const nueva=paginaActual+delta;
        if(nueva<1||nueva>totalPaginas) return;
        irAPagina(nueva);
    }

    window.addEventListener('resize',()=>{
        const nuevo=window.innerWidth<768?5:10;
        if(nuevo!==filasPorPagina){
            filasPorPagina=nuevo;
            paginaActual=1;
            renderizarPagina();
        }
    });

    document.addEventListener('DOMContentLoaded',()=>{
        filasFiltradas=obtenerFilas();
        renderizarPagina();
    });
</script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
