<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pill One - Gestión de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F7F7FF; color: #1D1E18; }
    </style>
</head>
<body class="bg-[#F7F7FF] font-sans text-[#1D1E18] antialiased min-h-screen flex flex-col">

<!-- TOPBAR -->
<div th:replace="layout :: topbar('Clientes')"></div>

<!-- CONTENEDOR CENTRAL (Sidebar + Área Principal) -->
<div class="flex flex-1 relative">

    <!-- SIDEBAR -->
    <div th:replace="layout :: sidebar('clientes')"></div>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <!-- MENSAJE FLASH -->
            <div th:if="${mensaje}" class="mb-6 rounded-lg bg-emerald-50 border border-emerald-200 p-4 text-emerald-800 text-sm font-medium shadow-sm flex items-center justify-between">
                <span th:text="${mensaje}">Mensaje de éxito</span>
            </div>

            <!-- ENCABEZADO -->
            <section class="mb-6">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-[#07004D] leading-tight uppercase">
                            Directorio de <br class="hidden md:block">
                            Clientes / Pacientes
                        </h1>
                        <p class="text-sm text-slate-500 mt-2">
                            Administre la información de los clientes, EPS y antecedentes de salud.
                        </p>
                    </div>
                    <div>
                        <a th:href="@{/view/clientes/form}"
                           class="inline-flex items-center justify-center rounded-lg bg-[#208AAE] px-6 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-sky-700 transition">
                            + Nuevo Cliente
                        </a>
                    </div>
                </div>
            </section>

            <!-- TABLA -->
            <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                        <tr class="bg-[#07004D] text-white border-b border-slate-100 text-[11px] uppercase tracking-wide">
                            <th class="px-5 py-4 text-left font-bold">Documento</th>
                            <th class="px-5 py-4 text-left font-bold">Nombre Completo</th>
                            <th class="px-5 py-4 text-left font-bold">Teléfono</th>
                            <th class="px-5 py-4 text-left font-bold">EPS</th>
                            <th class="px-5 py-4 text-left font-bold">Alergias</th>
                            <th class="px-5 py-4 text-center font-bold">Acciones</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                        <tr th:each="cliente : ${clientes}" class="hover:bg-slate-50 transition">
                            <td class="px-5 py-4">
                                        <span class="font-bold text-[#208AAE]"
                                              th:text="${cliente.tipoDocumento + ' - ' + cliente.numeroDocumento}">
                                        </span>
                            </td>
                            <td class="px-5 py-4 font-semibold text-slate-700" th:text="${cliente.nombreCompleto}"></td>
                            <td class="px-5 py-4 text-slate-600" th:text="${cliente.telefono}"></td>
                            <td class="px-5 py-4 text-slate-600" th:text="${cliente.eps}"></td>
                            <td class="px-5 py-4 text-rose-600 font-medium text-xs" th:text="${cliente.alergias}"></td>
                            <td class="px-5 py-4">
                                <div class="flex items-center justify-center gap-3">
                                    <a th:href="@{'/view/clientes/edit/' + ${cliente.id_cliente}}"
                                       class="text-slate-500 hover:text-[#208AAE] transition text-base" title="Editar">✏️</a>
                                    <form th:action="@{'/view/clientes/delete/' + ${cliente.id_cliente}}" method="post" onsubmit="return confirm('¿Estás seguro de eliminar este cliente?');">
                                        <button type="submit" class="text-slate-500 hover:text-rose-600 transition text-base bg-transparent border-0 cursor-pointer" title="Eliminar">🗑️</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="6" class="px-6 py-10 text-center text-slate-500">
                                No hay clientes registrados en el sistema.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

        <!-- FOOTER -->
        <div th:replace="layout :: footer"></div>
    </div>

</div>

</body>
</html>
