<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Global - PillOne</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Estilos del sidebar (submenu-container: colapsado + transición) -->
    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pillone: {
                            bg: '#F7F7FF',
                            dark: '#07004D',
                            darker: '#04002C',
                            accent: '#208AAE',
                            text: '#1D1E18'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-soft:#FAFBFE;
            --ui-muted:#667085;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .config-shell{
            background:var(--pillone-bg);
        }
        .config-panel{
            background:#fff;
            border:1px solid var(--ui-border);
            box-shadow:var(--ui-shadow);
        }
        .config-control{
            border:1px solid var(--ui-border);
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .config-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        .config-section-head{
            display:flex;
            align-items:center;
            gap:.7rem;
            padding:1rem 1.15rem;
            border-bottom:1px solid #EEF0F4;
            background:#FCFCFE;
        }
        .config-icon{
            width:2.25rem;
            height:2.25rem;
            border-radius:.75rem;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(32,138,174,.10);
            color:var(--pillone-accent);
            flex:none;
        }
        .config-label{
            display:block;
            color:#475467;
            font-size:11px;
            font-weight:700;
            letter-spacing:.035em;
            text-transform:uppercase;
            margin-bottom:.45rem;
        }
        .payment-chip{
            display:inline-flex;
            align-items:center;
            gap:.35rem;
            padding:.4rem .65rem;
            border-radius:.65rem;
            background:#F2F8FB;
            color:var(--pillone-accent);
            border:1px solid rgba(32,138,174,.16);
            font-size:11px;
            font-weight:600;
        }
        .config-actions{
            position:sticky;
            bottom:0;
            z-index:5;
            margin-top:1rem;
            padding:.9rem 0 .25rem;
            background:linear-gradient(to top,var(--pillone-bg) 75%,rgba(247,247,255,0));
        }
        @media(max-width:767px){
            .config-main{padding:1rem!important;}
            .config-grid{grid-template-columns:1fr!important;}
            .config-card-body{padding:1rem!important;}
            .config-actions{
                display:grid!important;
                grid-template-columns:1fr 1fr;
                gap:.65rem!important;
                padding-bottom:.5rem;
            }
            .config-actions>*{
                width:100%;
                justify-content:center;
            }
        }
        @media(max-width:480px){
            .config-actions{grid-template-columns:1fr;}
        }
    </style>

</head>

<body class="bg-pillone-bg text-pillone-text antialiased min-h-screen flex flex-col text-xs font-sans">

<!-- TOPBAR GLOBAL -->
<div th:replace="fragments/layout :: topbar('Configuración del Sistema')"></div>

<!-- CONTENEDOR CENTRAL -->
<div class="config-shell flex flex-1 relative min-h-[calc(100vh-4rem)]">

    <!-- OVERLAY MÓVIL -->
    <div id="overlay" class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-20 hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR GLOBAL -->
    <div th:replace="fragments/layout :: sidebar('configuracion')"></div>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0">
        <main class="config-main flex-1 p-4 sm:p-6 lg:p-8 max-w-[1450px] mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark">
                            Parámetros del Sistema
                        </h1>
                        <p class="text-xs text-slate-500 mt-1">
                            Administra los datos corporativos, fiscales y de control operativo de la farmacia en PillOne.
                        </p>
                    </div>
                </div>
            </section>

            <!-- ALERTA DE ÉXITO -->
            <div th:if="${mensaje}" class="mb-5 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    <span class="font-medium" th:text="${mensaje}"></span>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-200/60 text-emerald-900 px-2 py-0.5 rounded">Éxito</span>
            </div>

            <form th:action="@{/view/configuracion/save}"
                  th:object="${configuracion}"
                  method="post"
                  novalidate>

                <input type="hidden" th:field="*{id}" />

                <div class="config-grid grid grid-cols-1 xl:grid-cols-2 gap-5 items-start">

                    <!-- SECCIÓN 1: DATOS CORPORATIVOS Y FISCALES -->
                    <section class="config-panel rounded-2xl overflow-hidden flex flex-col">

                        <div class="config-section-head">
                            <div class="config-icon">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                </svg>
                            </div>
                            <h2 class="text-xs font-bold text-pillone-dark">
                                Información Corporativa y Fiscal
                            </h2>
                        </div>

                        <div class="config-card-body p-5 grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">

                            <div class="md:col-span-2">
                                <label class="config-label">
                                    Nombre Comercial de la Farmacia
                                </label>
                                <input type="text" th:field="*{nombreFarmacia}" required
                                       placeholder="Ej: FarmaSoft Plus S.A.S."
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                            <div>
                                <label class="config-label">
                                    NIT / Identificación Fiscal
                                </label>
                                <input type="text" th:field="*{nit}" required
                                       placeholder="Ej: 900123456-7"
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                            <div>
                                <label class="config-label">
                                    Moneda del Sistema
                                </label>
                                <input type="text" th:field="*{moneda}"
                                       placeholder="Ej: COP"
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                            <div>
                                <label class="config-label">
                                    Teléfono de Contacto
                                </label>
                                <input type="text" th:field="*{telefono}"
                                       placeholder="Ej: 6022345678"
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                            <div>
                                <label class="config-label">
                                    Dirección de la Sede
                                </label>
                                <input type="text" th:field="*{direccion}"
                                       placeholder="Ej: Calle Principal # 10-20"
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                        </div>
                    </section>

                    <!-- SECCIÓN 2: PARÁMETROS FINANCIEROS Y DE ALERTA -->
                    <section class="config-panel rounded-2xl overflow-hidden flex flex-col">

                        <div class="config-section-head">
                            <div class="config-icon">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <h2 class="text-xs font-bold text-pillone-dark">
                                Parámetros Financieros y Alertas
                            </h2>
                        </div>

                        <div class="config-card-body p-5 grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">

                            <div>
                                <label class="config-label">
                                    Porcentaje de IVA General (%)
                                </label>
                                <input type="number" step="0.01" th:field="*{ivaGeneral}" required
                                       placeholder="19.00"
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                            <div>
                                <label class="config-label">
                                    Alerta Vencimiento (Días)
                                </label>
                                <input type="number" th:field="*{tiempoAlertaVencimientoDias}" required
                                       placeholder="60"
                                       class="config-control w-full rounded-xl px-3.5 py-2.5 text-xs outline-none">
                            </div>

                            <div class="md:col-span-2 mt-2">
                                <label class="config-label">
                                    Métodos de Pago Habilitados en Caja (POS)
                                </label>
                                <div class="flex flex-wrap gap-2 p-3 rounded-xl border border-slate-200 bg-slate-50">
                                    <span th:each="metodo : ${metodosPago}"
                                          class="payment-chip"
                                          th:text="${metodo}"></span>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-1">Estos métodos operan de forma global en los registros de ventas del sistema.</p>
                            </div>

                        </div>
                    </section>

                </div>

                <!-- BOTONERA DE ACCIÓN -->
                <div class="config-actions flex items-center justify-end gap-3">
                    <a th:href="@{/view/configuracion}"
                       class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 hover:text-pillone-dark transition cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Recargar Valores
                    </a>

                    <button type="submit"
                            class="inline-flex items-center gap-2 rounded-xl bg-pillone-dark px-6 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-pillone-darker transition cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        Guardar Configuración
                    </button>
                </div>

            </form>

        </main>

        <!-- FOOTER GLOBAL -->
        <footer th:replace="fragments/layout :: footer"></footer>
    </div>
</div>

<!-- Scripts del sidebar (toggleSidebar / toggleSubmenu) -->
<div th:replace="fragments/layout :: scripts"></div>

<script th:src="@{/js/script.js}" defer></script>

</body>
</html>
