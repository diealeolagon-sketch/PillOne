<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Formulario de Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pillone: {
                            bg: '#F7F7FF',
                            dark: '#07004D',
                            darker: '#04002C',
                            accent: '#208AAE',
                            text: '#1D1E18'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<!-- TOPBAR -->
<div th:replace="fragments/layout :: topbar('Productos')"></div>

<!-- CONTENEDOR PRINCIPAL -->
<div class="flex flex-1 relative min-h-[calc(100vh-4rem)] bg-pillone-bg">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('productos')"></div>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 bg-pillone-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <!-- ENCABEZADO -->
            <section class="mb-5">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                        <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark leading-tight uppercase tracking-tight"
                            th:text="${producto.idProducto != null ? 'Editar Producto' : 'Registro de Nuevo Producto'}">
                            Gestión de Producto
                        </h1>
                        <p class="text-xs text-slate-500 mt-1">
                            Complete los campos requeridos para almacenar o actualizar la información del medicamento en el inventario.
                        </p>
                    </div>
                    <div>
                        <a th:href="@{/view/productos}"
                           class="inline-flex items-center justify-center gap-2 rounded-lg bg-slate-200 px-4 py-2.5 text-xs font-bold text-slate-700 shadow-sm hover:bg-slate-300 transition cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            Volver al Listado
                        </a>
                    </div>
                </div>
            </section>

            <!-- FORMULARIO PRINCIPAL -->
            <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                <form th:action="@{/view/productos/save}" th:object="${producto}" method="post" class="p-6 space-y-6">

                    <!-- Campo oculto para ID (Actualización) -->
                    <input type="hidden" th:field="*{idProducto}" />

                    <!-- SECCIÓN 1: Identificación y Nombres -->
                    <div>
                        <h2 class="text-xs font-bold text-pillone-dark uppercase tracking-wider border-b border-slate-100 pb-2 mb-4">
                            1. Identificación del Producto
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Código Interno <span class="text-rose-500">*</span></label>
                                <input type="text" th:field="*{codigoInterno}" required placeholder="Ej. PROD-001"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Código de Barras</label>
                                <input type="text" th:field="*{codigoBarras}" placeholder="Ej. 770123456789"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Nombre Comercial <span class="text-rose-500">*</span></label>
                                <input type="text" th:field="*{nombreComercial}" required placeholder="Ej. Doralgin"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Nombre Genérico</label>
                                <input type="text" th:field="*{nombreGenerico}" placeholder="Ej. Metamizol Sódico"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Presentación</label>
                                <input type="text" th:field="*{presentacion}" placeholder="Ej. Caja x 100 tabletas"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Concentración</label>
                                <input type="text" th:field="*{concentracion}" placeholder="Ej. 500mg"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: Detalles Clínicos y Fabricante -->
                    <div>
                        <h2 class="text-xs font-bold text-pillone-dark uppercase tracking-wider border-b border-slate-100 pb-2 mb-4">
                            2. Fabricante y Control Sanitario
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Laboratorio</label>
                                <input type="text" th:field="*{laboratorio}" placeholder="Ej. Bayer / Genfar"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Registro INVIMA</label>
                                <input type="text" th:field="*{registroInvima}" placeholder="Ej. 2023M-0001234"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Ubicación en Estante</label>
                                <input type="text" th:field="*{ubicacionEstante}" placeholder="Ej. Pasillo 3 - Estante B"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: Precios y Stock -->
                    <div>
                        <h2 class="text-xs font-bold text-pillone-dark uppercase tracking-wider border-b border-slate-100 pb-2 mb-4">
                            3. Precios y Existencias
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Precio de Compra <span class="text-rose-500">*</span></label>
                                <input type="number" step="0.01" th:field="*{precioCompra}" required placeholder="0.00"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Precio de Venta <span class="text-rose-500">*</span></label>
                                <input type="number" step="0.01" th:field="*{precioVenta}" required placeholder="0.00"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Stock Total</label>
                                <input type="number" th:field="*{stockTotal}" placeholder="0"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Stock Mínimo (Alerta)</label>
                                <input type="number" th:field="*{stockMinimo}" placeholder="5"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 4: Restricciones y Atributos Especiales -->
                    <div>
                        <h2 class="text-xs font-bold text-pillone-dark uppercase tracking-wider border-b border-slate-100 pb-2 mb-4">
                            4. Atributos y Restricciones
                        </h2>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4">
                            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200 hover:bg-slate-100/50 transition">
                                <input type="checkbox" th:field="*{requiereFormula}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                                <span class="font-medium text-slate-700">Requiere Fórmula</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200 hover:bg-slate-100/50 transition">
                                <input type="checkbox" th:field="*{esVentaLibre}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                                <span class="font-medium text-slate-700">Venta Libre (OTC)</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200 hover:bg-slate-100/50 transition">
                                <input type="checkbox" th:field="*{esControlado}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                                <span class="font-medium text-slate-700">Medicamento Controlado</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200 hover:bg-slate-100/50 transition">
                                <input type="checkbox" th:field="*{requiereRefrigeracion}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                                <span class="font-medium text-slate-700">Refrigeración</span>
                            </label>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Estado del Producto</label>
                                <select th:field="*{estado}" class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                                    <option value="ACTIVO">Activo</option>
                                    <option value="INACTIVO">Inactivo</option>
                                    <option value="AGOTADO">Agotado</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Restricciones de Venta</label>
                                <input type="text" th:field="*{restriccionesVenta}" placeholder="Ej. Mayor de edad"
                                       class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            </div>
                        </div>

                        <div class="mt-4">
                            <label class="block font-semibold text-slate-700 mb-1">Descripción Detallada</label>
                            <textarea th:field="*{descripcion}" rows="3" placeholder="Información adicional sobre el medicamento..."
                                      class="w-full px-3.5 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition"></textarea>
                        </div>
                    </div>

                    <!-- BOTONES DE ACCIÓN -->
                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                        <a th:href="@{/view/productos}"
                           class="px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-semibold hover:bg-slate-50 transition shadow-xs">
                            Cancelar
                        </a>
                        <button type="submit"
                                class="px-5 py-2 rounded-lg bg-pillone-accent text-white font-bold hover:opacity-90 transition shadow-sm cursor-pointer">
                            Guardar Producto
                        </button>
                    </div>

                </form>
            </section>
        </main>

        <!-- FOOTER -->
        <footer th:replace="fragments/layout :: footer"></footer>
    </div>
</div>

<!-- SCRIPTS DEL LAYOUT -->
<div th:replace="fragments/layout :: scripts"></div>

</body>
</html>
