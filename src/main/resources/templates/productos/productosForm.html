<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Formulario de Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pillone: {
                            bg: '#F7F7FF',
                            dark: '#07004D',
                            darker: '#04002C',
                            accent: '#208AAE',
                            text: '#1D1E18'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<!-- TOPBAR GLOBAL -->
<header th:replace="fragments/layout :: topbar('Gestión de Productos')"></header>

<!-- CONTENEDOR CENTRAL -->
<div class="flex flex-1 relative">

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden"></div>

    <!-- SIDEBAR GLOBAL -->
    <aside th:replace="fragments/layout :: sidebar('productos')"></aside>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5 flex items-center justify-between">
                <div>
                    <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase tracking-tight"
                        th:text="${producto.idProducto == null} ? 'Registrar Nuevo Producto' : 'Actualizar Producto'">
                        Formulario de Producto
                    </h1>
                    <p class="text-xs text-slate-500 mt-1">Complete los campos requeridos para almacenar la información en el sistema.</p>
                </div>
                <a th:href="@{/view/productos}" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 font-medium hover:bg-slate-50 transition shadow-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Volver
                </a>
            </section>

            <!-- MENSAJE DE ERROR FLASH -->
            <div th:if="${error}" class="mb-4 rounded-lg bg-rose-50 border border-rose-200 p-3 text-rose-800 text-xs font-medium shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span th:text="${error}">Mensaje de error</span>
            </div>

            <!-- TARJETA DEL FORMULARIO -->
            <section class="rounded-xl border border-slate-200 bg-white shadow-sm p-6">
                <form th:action="@{/view/productos/save}" th:object="${producto}" method="post" class="space-y-4">
                    <input type="hidden" th:field="*{idProducto}" />

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Código Interno <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{codigoInterno}" required placeholder="Ej. MED-001"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Código de Barras <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{codigoBarras}" required placeholder="Ej. 7701234567890"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Nombre Comercial <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{nombreComercial}" required placeholder="Ej. Doxilub 500mg"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Nombre Genérico</label>
                            <input type="text" th:field="*{nombreGenerico}" placeholder="Ej. Paracetamol"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Categoría <span class="text-rose-500">*</span></label>
                            <select th:field="*{categoria}" required class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                                <option value="">Seleccione categoría...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Proveedor <span class="text-rose-500">*</span></label>
                            <select th:field="*{proveedor}" required class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                                <option value="">Seleccione proveedor...</option>
                                <option th:each="prov : ${proveedores}" th:value="${prov.idProveedor}" th:text="${prov.nombreRazonSocial}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Registro Invima <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{registroInvima}" required placeholder="Ej. 2020M-0012345"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Precio Compra <span class="text-rose-500">*</span></label>
                            <input type="number" step="0.01" th:field="*{precioCompra}" required placeholder="0.00"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Precio Venta <span class="text-rose-500">*</span></label>
                            <input type="number" step="0.01" th:field="*{precioVenta}" required placeholder="0.00"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Stock Inicial</label>
                            <input type="number" th:field="*{stockTotal}" placeholder="0"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Stock Mínimo</label>
                            <input type="number" th:field="*{stockMinimo}" placeholder="10"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Laboratorio</label>
                            <input type="text" th:field="*{laboratorio}" placeholder="Ej. Bayer"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Presentación</label>
                            <input type="text" th:field="*{presentacion}" placeholder="Ej. Caja x 30 tabletas"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Ubicación en Estante</label>
                            <input type="text" th:field="*{ubicacionEstante}" placeholder="Ej. Estante 3 - Nivel 2"
                                   class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" th:field="*{requiereFormula}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                            <span class="text-slate-700 font-medium">Requiere Fórmula</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" th:field="*{esVentaLibre}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                            <span class="text-slate-700 font-medium">Venta Libre</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" th:field="*{esControlado}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                            <span class="text-slate-700 font-medium">Es Controlado</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" th:field="*{requiereRefrigeracion}" class="rounded border-slate-300 text-pillone-accent focus:ring-pillone-accent">
                            <span class="text-slate-700 font-medium">Refrigeración</span>
                        </label>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Estado</label>
                        <select th:field="*{estado}" class="w-full sm:w-1/3 px-3 py-2 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent focus:ring-2 focus:ring-pillone-accent/20 bg-slate-50/50 transition">
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="INACTIVO">INACTIVO</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                        <a th:href="@{/view/productos}" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50 transition shadow-xs">Cancelar</a>
                        <button type="submit" class="px-5 py-2 rounded-lg bg-pillone-accent text-white font-bold shadow-sm hover:opacity-90 transition">Guardar Producto</button>
                    </div>
                </form>
            </section>
        </main>

        <footer th:replace="fragments/layout :: footer"></footer>
    </div>
</div>

<div th:replace="fragments/layout :: scripts"></div>
<script th:src="@{/js/script.js}" defer></script>
</body>
</html>
