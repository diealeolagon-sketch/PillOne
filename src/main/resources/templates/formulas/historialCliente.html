<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Historial de fórmulas | PillOne</title><th:block th:replace="~{fragments/layout :: styles}"></th:block></head><body class="bg-pillone-bg text-pillone-text min-h-screen"><header th:replace="~{fragments/layout :: topbar('Historial de fórmulas')}"></header><aside th:replace="~{fragments/layout :: sidebar('formulas')}"></aside><main class="lg:ml-72 pt-20 min-h-screen p-4 md:p-7"><div class="max-w-6xl mx-auto"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6"><div><p class="text-[10px] uppercase tracking-[.18em] font-bold text-pillone-accent">Paciente / cliente</p><h1 class="text-2xl md:text-3xl font-bold text-pillone-dark mt-1" th:text="${cliente != null ? cliente.nombreCompleto : 'Historial de fórmulas'}">Historial</h1><p class="text-slate-500 mt-1">Consulta cronológica de las fórmulas registradas.</p></div><div class="flex gap-2"><a th:href="@{/view/formulas}" class="px-4 py-2.5 rounded-xl border border-slate-200 bg-white font-semibold text-slate-700">Todas las fórmulas</a><a th:if="${cliente != null}" th:href="@{/view/formulas/form(cliente=${cliente.id_cliente})}" class="px-4 py-2.5 rounded-xl bg-pillone-dark text-white font-semibold shadow-sm">Nueva fórmula</a></div></div><div class="grid gap-4"><article th:each="f : ${formulas}" class="bg-white rounded-2xl border border-slate-200 p-5"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><div><div class="flex items-center gap-2"><span class="font-bold text-pillone-dark" th:text="${'Fórmula #' + f.idFormula}">Fórmula</span><span class="px-2.5 py-1 rounded-full text-[10px] font-bold" th:classappend="${f.estado == 'VIGENTE'} ? ' bg-emerald-50 text-emerald-700 border border-emerald-200' : ' bg-red-50 text-red-700 border border-red-200'" th:text="${f.estado}">VIGENTE</span></div><p class="text-sm text-slate-600 mt-2"><span class="font-semibold" th:text="${f.nombreMedico}">Médico</span><span th:if="${f.entidadSalud != null}" th:text="${' · ' + f.entidadSalud}"></span></p><p class="text-xs text-slate-400 mt-1" th:text="${#temporals.format(f.fechaExpedicion,'dd/MM/yyyy') + ' → ' + #temporals.format(f.fechaVencimiento,'dd/MM/yyyy')}">Fecha</p></div><a th:href="@{/view/formulas/detalle/{id}(id=${f.idFormula})}" class="px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-pillone-dark font-semibold text-center">Ver detalle</a></div></article><div th:if="${#lists.isEmpty(formulas)}" class="bg-white rounded-2xl border border-slate-200 p-10 text-center"><h2 class="font-bold text-pillone-dark text-lg">Sin fórmulas registradas</h2><p class="text-slate-500 mt-1">Este cliente aún no tiene fórmulas en su historial.</p></div></div></div></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
