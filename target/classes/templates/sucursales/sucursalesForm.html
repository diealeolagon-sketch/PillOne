<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${sucursal.idSucursal == null
        ? 'Nueva Sucursal - PillOne'
        : 'Editar Sucursal - PillOne'}">

        Sucursal

    </title>

    <th:block th:replace="~{fragments/layout :: styles}">
    </th:block>

</head>

<body class="bg-pillone-bg
             font-sans
             text-pillone-text
             antialiased
             min-h-screen">

<header th:replace="~{fragments/layout :: topbar('Sucursales')}">
</header>

<div class="flex min-h-[calc(100vh-4rem)]">

    <aside th:replace="~{fragments/layout :: sidebar('sucursales')}">
    </aside>

    <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8">

        <div class="max-w-4xl mx-auto">

            <div class="mb-5">

                <a th:href="@{/view/sucursales}"
                   class="inline-flex
                          items-center
                          gap-2
                          text-xs
                          text-slate-500
                          hover:text-pillone-accent
                          font-semibold">

                    <svg class="w-4 h-4"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M15 18l-6-6 6-6"/>

                    </svg>

                    Volver a sucursales

                </a>

            </div>

            <div th:if="${error}"
                 class="mb-4
                        p-3
                        rounded-xl
                        bg-red-50
                        border
                        border-red-200
                        text-red-700
                        text-sm
                        font-semibold"
                 th:text="${error}">
            </div>

            <section class="bg-white
                            border
                            border-slate-200
                            rounded-2xl
                            shadow-sm
                            overflow-hidden">

                <div class="bg-pillone-dark
                            text-white
                            px-6
                            py-5">

                    <p class="text-[10px]
                              uppercase
                              tracking-[.2em]
                              text-blue-200
                              font-bold">

                        Configuración de sede

                    </p>

                    <h1 class="text-xl
                               sm:text-2xl
                               font-bold
                               mt-1"
                        th:text="${sucursal.idSucursal == null
                            ? 'Nueva sucursal'
                            : 'Editar sucursal'}">

                        Nueva sucursal

                    </h1>

                    <p class="text-xs
                              text-slate-300
                              mt-1">

                        Registra los datos básicos
                        de la sede de PillOne.

                    </p>

                </div>

                <form th:action="@{/view/sucursales/save}"
                      th:object="${sucursal}"
                      method="post"
                      class="p-6">

                    <input type="hidden"
                           th:field="*{idSucursal}">

                    <div class="grid
                                grid-cols-1
                                md:grid-cols-2
                                gap-5">

                        <div class="md:col-span-2">

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Nombre de la sucursal *

                            </label>

                            <input type="text"
                                   th:field="*{nombre}"
                                   maxlength="150"
                                   required
                                   placeholder="Ej. PillOne Centro"
                                   class="w-full
                                          px-3.5
                                          py-2.5
                                          rounded-xl
                                          border
                                          border-slate-200
                                          bg-slate-50
                                          outline-none
                                          focus:border-pillone-accent
                                          text-sm">

                        </div>

                        <div>

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Código *

                            </label>

                            <input type="text"
                                   th:field="*{codigo}"
                                   maxlength="30"
                                   required
                                   placeholder="Ej. TUL-01"
                                   oninput="this.value=this.value.toUpperCase()"
                                   class="w-full
                                          px-3.5
                                          py-2.5
                                          rounded-xl
                                          border
                                          border-slate-200
                                          bg-slate-50
                                          outline-none
                                          focus:border-pillone-accent
                                          text-sm">

                            <p class="text-[10px]
                                      text-slate-400
                                      mt-1">

                                Debe ser único para cada sede.

                            </p>

                        </div>

                        <div>

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Teléfono

                            </label>

                            <input type="tel"
                                   th:field="*{telefono}"
                                   maxlength="15"
                                   placeholder="Ej. 3151234567"
                                   class="w-full
                                          px-3.5
                                          py-2.5
                                          rounded-xl
                                          border
                                          border-slate-200
                                          bg-slate-50
                                          outline-none
                                          focus:border-pillone-accent
                                          text-sm">

                        </div>

                        <div class="md:col-span-2">

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Dirección *

                            </label>

                            <input type="text"
                                   th:field="*{direccion}"
                                   maxlength="200"
                                   required
                                   placeholder="Ej. Carrera 26 # 28-15"
                                   class="w-full
                                          px-3.5
                                          py-2.5
                                          rounded-xl
                                          border
                                          border-slate-200
                                          bg-slate-50
                                          outline-none
                                          focus:border-pillone-accent
                                          text-sm">

                        </div>

                        <div>

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Ciudad

                            </label>

                            <input type="text"
                                   th:field="*{ciudad}"
                                   maxlength="100"
                                   class="w-full
                                          px-3.5
                                          py-2.5
                                          rounded-xl
                                          border
                                          border-slate-200
                                          bg-slate-50
                                          outline-none
                                          focus:border-pillone-accent
                                          text-sm">

                        </div>

                        <div>

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Departamento

                            </label>

                            <input type="text"
                                   th:field="*{departamento}"
                                   maxlength="100"
                                   class="w-full
                                          px-3.5
                                          py-2.5
                                          rounded-xl
                                          border
                                          border-slate-200
                                          bg-slate-50
                                          outline-none
                                          focus:border-pillone-accent
                                          text-sm">

                        </div>

                        <div th:if="${sucursal.idSucursal != null}"
                             class="md:col-span-2">

                            <label class="block
                                          text-xs
                                          font-bold
                                          text-slate-600
                                          mb-1.5">

                                Estado

                            </label>

                            <div class="p-3
                                        rounded-xl
                                        bg-slate-50
                                        border
                                        border-slate-200">

                                <span th:if="${sucursal.estado == 'ACTIVA'}"
                                      class="inline-flex
                                             px-2.5
                                             py-1
                                             rounded-full
                                             bg-emerald-100
                                             text-emerald-700
                                             text-[10px]
                                             font-bold">

                                    ACTIVA

                                </span>

                                <span th:unless="${sucursal.estado == 'ACTIVA'}"
                                      class="inline-flex
                                             px-2.5
                                             py-1
                                             rounded-full
                                             bg-slate-200
                                             text-slate-600
                                             text-[10px]
                                             font-bold">

                                    INACTIVA

                                </span>

                                <input type="hidden"
                                       th:field="*{estado}">

                                <p class="text-[10px]
                                          text-slate-400
                                          mt-2">

                                    El estado se administra
                                    desde el listado de sucursales.

                                </p>

                            </div>

                        </div>

                    </div>

                    <div class="flex
                                flex-col-reverse
                                sm:flex-row
                                sm:justify-end
                                gap-3
                                mt-7
                                pt-5
                                border-t
                                border-slate-100">

                        <a th:href="@{/view/sucursales}"
                           class="px-5
                                  py-2.5
                                  rounded-xl
                                  border
                                  border-slate-200
                                  text-slate-600
                                  text-sm
                                  font-semibold
                                  text-center
                                  hover:bg-slate-50">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="inline-flex
                                       items-center
                                       justify-center
                                       gap-2
                                       px-5
                                       py-2.5
                                       rounded-xl
                                       bg-pillone-accent
                                       text-white
                                       text-sm
                                       font-bold
                                       hover:opacity-90">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M5 12l4 4 10-10"/>

                            </svg>

                            <span th:text="${sucursal.idSucursal == null
                                ? 'Registrar sucursal'
                                : 'Guardar cambios'}">

                                Guardar

                            </span>

                        </button>

                    </div>

                </form>

            </section>

        </div>

    </main>

</div>

<footer th:replace="~{fragments/layout :: footer}">
</footer>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
