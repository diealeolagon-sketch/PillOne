<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Categoría</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
</head>
<body style="font-family: 'Poppins', sans-serif;">
<div class="container mx-auto mt-5 max-w-lg">
    <h1 class="text-2xl font-bold mb-4" th:text="${categoria.id == null ? 'Nueva Categoría' : 'Editar Categoría'}"></h1>

    <form th:action="@{/view/categorias/save}" th:object="${categoria}" method="post" class="bg-white p-6 border rounded shadow">

        <!-- Campo oculto para el ID en caso de edición -->
        <input type="hidden" th:field="*{id}" />

        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Nombre:</label>
            <input type="text" th:field="*{nombre}" class="w-full border px-3 py-2 rounded" required />
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Descripción:</label>
            <textarea th:field="*{descripcion}" class="w-full border px-3 py-2 rounded"></textarea>
        </div>

        <div class="flex justify-between">
            <a th:href="@{/view/categorias}" class="bg-gray-500 text-white px-4 py-2 rounded">Cancelar</a>
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Guardar</button>
        </div>
    </form>
</div>
</body>
</html>
