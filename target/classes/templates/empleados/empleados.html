<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Empleados - PillOne
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>

        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:[
                            'Poppins',
                            'sans-serif'
                        ]
                    }
                }
            }
        }

    </script>


    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .employees-shell{background:var(--pillone-bg);}
        .employees-panel{
            background:#fff;
            border:1px solid var(--ui-border);
            box-shadow:var(--ui-shadow);
        }
        .employees-control{
            border:1px solid var(--ui-border);
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .employees-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        .employee-row{transition:background .15s ease,box-shadow .15s ease;}
        .employee-row:hover{
            background:#FAFBFE;
            box-shadow:inset 3px 0 0 rgba(32,138,174,.5);
        }
        .icon-action{
            width:2.2rem;
            height:2.2rem;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border-radius:.7rem;
            transition:transform .15s ease,background .15s ease;
        }
        .icon-action:hover{transform:translateY(-1px);}
        .employees-pagination{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            padding:.9rem 1rem;
            border-top:1px solid var(--ui-border);
            background:#fff;
        }
        .page-controls{display:flex;align-items:center;gap:.35rem;}
        .page-btn{
            min-width:2.25rem;height:2.25rem;padding:0 .7rem;
            display:inline-flex;align-items:center;justify-content:center;
            border:1px solid var(--ui-border);border-radius:.65rem;
            background:#fff;color:#475467;font-size:.72rem;font-weight:600;
        }
        .page-btn.active{background:var(--pillone-dark);color:#fff;border-color:var(--pillone-dark);}
        .page-btn:disabled{opacity:.4;cursor:not-allowed;}
        @media(max-width:767px){
            .employees-main{padding:1rem!important;}
            .employees-header{align-items:stretch!important;}
            .employees-header>a{width:100%;}
            .employees-toolbar{
                position:sticky;top:0;z-index:6;
                background:rgba(255,255,255,.96);
                backdrop-filter:blur(10px);
            }
            #buscador-tabla{font-size:16px!important;}
            .employees-table-wrap{overflow:visible!important;padding:.75rem;background:#F7F7FF;}
            .employees-table,.employees-table tbody{display:block;width:100%;min-width:0!important;}
            .employees-table thead{display:none;}
            .employees-table tbody{border:0!important;}
            .employees-table .fila-empleado{
                display:block;background:#fff;border:1px solid var(--ui-border);
                border-radius:1rem;margin-bottom:.75rem;overflow:hidden;
                box-shadow:0 6px 18px rgba(7,0,77,.04);
            }
            .employees-table .fila-empleado td{
                display:flex;align-items:flex-start;justify-content:space-between;
                gap:1rem;padding:.68rem .85rem!important;text-align:right!important;border:0;
            }
            .employees-table .fila-empleado td::before{
                content:attr(data-label);flex:0 0 6rem;text-align:left;color:#98A2B3;
                font-size:.62rem;font-weight:700;text-transform:uppercase;
            }
            .employees-table .fila-empleado td:nth-child(2){
                display:block;text-align:left!important;background:#FCFCFE;
                border-bottom:1px solid #F0F1F5;
            }
            .employees-table .fila-empleado td:nth-child(2)::before{
                display:block;margin-bottom:.35rem;
            }
            .employees-table .fila-empleado td:last-child{
                display:block;border-top:1px solid #F0F1F5;
            }
            .employees-table .fila-empleado td:last-child::before{display:block;margin-bottom:.5rem;}
            .employees-table .fila-empleado td:last-child>div{justify-content:flex-end!important;flex-wrap:wrap;}
            .employees-pagination{
                position:sticky;bottom:0;z-index:5;flex-direction:column;
                align-items:stretch;gap:.55rem;padding:.75rem;
                background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
            }
            .page-controls{justify-content:center;}
            #paginacion-info{text-align:center;}
        }
    </style>

</head>

<body class="bg-pillone-bg text-pillone-text antialiased min-h-screen flex flex-col text-xs font-sans">

<header th:replace="fragments/layout :: topbar('Gestión de Empleados')"></header>

<div class="employees-shell flex flex-1 relative">

    <div
            id="overlay"
            onclick="toggleSidebar()"
            class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('empleados')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="employees-main flex-1 p-4 sm:p-6 lg:p-8 max-w-[1450px] mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5">

                <div class="employees-header flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                    <div>

                        <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark">

                            Empleados y accesos

                        </h1>

                        <p class="text-xs text-slate-500 mt-1">

                            Administra el personal y sus credenciales de ingreso desde un solo módulo.

                        </p>

                    </div>

                    <a
                            th:href="@{/view/empleados/form}"
                            class="inline-flex items-center justify-center gap-2 rounded-xl bg-pillone-dark px-4 py-2.5 font-semibold text-white shadow-sm hover:bg-pillone-darker transition">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>Nuevo empleado

                    </a>

                </div>

            </section>

            <!-- MENSAJE -->
            <div
                    th:if="${mensaje}"
                    class="mb-4 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-emerald-800 font-medium"
                    th:text="${mensaje}">
            </div>

            <!-- ERROR -->
            <div
                    th:if="${error}"
                    class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                    th:text="${error}">
            </div>

            <section class="employees-panel rounded-2xl overflow-hidden">

                <!-- BUSCADOR -->
                <div class="employees-toolbar p-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                    <div class="relative w-full sm:w-96">

                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                <circle cx="11" cy="11" r="7"/>
                                <path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
                            </svg>

                        </span>

                        <input
                                type="text"
                                id="buscador-tabla"
                                onkeyup="filtrarTabla()"
                                placeholder="Buscar empleado, documento, usuario, rol..."
                                class="employees-control w-full pl-9 pr-3 py-2.5 rounded-xl outline-none">

                    </div>

                    <span class="text-slate-500">

                        Total:

                        <b
                                id="contador-total"
                                th:text="${#lists.size(empleados)}">

                            0

                        </b>

                    </span>

                </div>

                <!-- TABLA -->
                <div class="employees-table-wrap overflow-x-auto">

                    <table class="employees-table min-w-[1150px] w-full text-xs">

                        <thead>

                        <tr class="bg-pillone-dark text-white text-left text-[10px] uppercase tracking-wider">

                            <th class="px-4 py-3.5 font-bold">
                                Documento
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Nombre
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Cargo / Salario
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Sucursal
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Acceso / Rol
                            </th>

                            <th class="px-4 py-3.5 font-bold">
                                Contacto
                            </th>

                            <th class="px-4 py-3.5 text-center font-bold">
                                Estado
                            </th>

                            <th class="px-4 py-3.5 text-center font-bold">
                                Acciones
                            </th>

                        </tr>

                        </thead>

                        <tbody class="divide-y divide-slate-100">

                        <tr
                                th:each="empleado : ${empleados}"
                                class="fila-empleado employee-row"
                                th:with="u=${usuariosPorEmpleado.get(empleado.id_empleado)}">

                            <!-- DOCUMENTO -->
                            <td class="px-4 py-3.5" data-label="Documento">

                                <span
                                        class="font-bold text-pillone-accent"
                                        th:text="${empleado.tipo_documento+' - '+empleado.numero_documento}">
                                </span>

                            </td>

                            <!-- NOMBRE -->
                            <td
                                    class="px-4 py-3.5 font-semibold text-slate-700"
                                    th:text="${empleado.nombre_completo}">
                            </td>

                            <!-- CARGO -->
                            <td class="px-4 py-3.5" data-label="Cargo / salario">

                                <div
                                        class="text-slate-700 font-medium"
                                        th:text="${empleado.cargo}">
                                </div>

                                <div
                                        class="text-[10px] font-semibold text-pillone-dark"
                                        th:text="${empleado.salario != null ? '$'+#numbers.formatDecimal(empleado.salario,0,'POINT',2,'COMMA') : 'N/A'}">
                                </div>

                            </td>

                            <!-- SUCURSAL -->
                            <td
                                    class="px-4 py-3.5 text-slate-600 font-medium"
                                    th:text="${empleado.sucursal != null ? empleado.sucursal.nombre : 'Sin sucursal'}">
                            </td>

                            <!-- ACCESO -->
                            <td class="px-4 py-3.5" data-label="Acceso / rol">

                                <div th:if="${u != null}">

                                    <div
                                            class="font-bold text-pillone-dark"
                                            th:text="${u.username}">
                                    </div>

                                    <div class="flex flex-wrap items-center gap-1 mt-1">

                                        <span
                                                class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 text-[9px] font-bold"
                                                th:text="${u.rol != null ? #strings.replace(u.rol.nombre,'_',' ') : 'SIN ROL'}">
                                        </span>

                                        <span
                                                class="px-2 py-0.5 rounded-full text-[9px] font-bold"
                                                th:classappend="${u.estado.name() == 'ACTIVO' ? 'bg-emerald-50 text-emerald-700' : (u.estado.name() == 'BLOQUEADO' ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-600')}"
                                                th:text="${u.estado}">
                                        </span>

                                    </div>

                                </div>

                                <div
                                        th:if="${u == null}"
                                        class="text-amber-600 font-semibold">

                                    Sin acceso creado

                                </div>

                            </td>

                            <!-- CONTACTO -->
                            <td class="px-4 py-3.5" data-label="Contacto">

                                <div
                                        class="text-slate-600"
                                        th:text="${empleado.telefono != null ? empleado.telefono : '-'}">
                                </div>

                                <div
                                        class="text-slate-400 text-[10px]"
                                        th:text="${empleado.correo != null ? empleado.correo : '-'}">
                                </div>

                            </td>

                            <!-- ESTADO -->
                            <td class="px-4 py-3.5 text-center" data-label="Estado">

                                <span
                                        class="inline-flex px-2 py-0.5 rounded-full text-[10px] font-bold"
                                        th:classappend="${empleado.estado == 'ACTIVO' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}"
                                        th:text="${empleado.estado}">
                                </span>

                            </td>

                            <!-- ACCIONES -->
                            <td class="px-4 py-3.5 text-center" data-label="Acciones">

                                <div class="flex items-center justify-center gap-1.5">

                                    <a
                                            th:href="@{/view/empleados/edit/{id}(id=${empleado.id_empleado})}"
                                            class="icon-action bg-blue-50 text-blue-700 hover:bg-blue-100 transition" title="Editar empleado">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17l-1 3zM14.5 7.5l2 2"/>
                                        </svg>

                                    </a>

                                    <form
                                            th:action="@{/view/empleados/delete/{id}(id=${empleado.id_empleado})}"
                                            method="post"
                                            onsubmit="return confirm('¿Seguro que deseas eliminar este empleado? Si tiene historial, el sistema no permitirá borrarlo.');">

                                        <button
                                                type="submit"
                                                class="icon-action bg-red-50 text-red-700 hover:bg-red-100 transition" title="Eliminar empleado">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/>
                                            </svg>

                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(empleados)}">

                            <td
                                    colspan="8"
                                    class="px-6 py-12 text-center text-slate-400">

                                No hay empleados registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <div id="paginacion-empleados" class="employees-pagination hidden">
                    <div id="paginacion-info" class="text-[11px] text-slate-500">Mostrando 0 de 0 empleados</div>
                    <div class="page-controls">
                        <button type="button" id="pagina-anterior" class="page-btn" onclick="cambiarPagina(-1)" aria-label="Página anterior">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <div id="numeros-pagina" class="page-controls"></div>
                        <button type="button" id="pagina-siguiente" class="page-btn" onclick="cambiarPagina(1)" aria-label="Página siguiente">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

            </section>

        </main>

        <footer th:replace="fragments/layout :: footer"></footer>

    </div>

</div>

<div th:replace="fragments/layout :: scripts"></div>

<script>

    function filtrarTabla(){
        const q=document.getElementById('buscador-tabla').value.toLowerCase().trim();
        filasFiltradas=obtenerFilas().filter(f=>!q || f.textContent.toLowerCase().includes(q));
        paginaActual=1;
        renderizarPagina();
    }

            );

        document
            .getElementById('contador-total')
            .textContent=
                visibles;
    }

</script>

<script th:src="@{/js/script.js}" defer>
    let paginaActual=1;
    let filasPorPagina=window.innerWidth<768?5:10;
    let filasFiltradas=[];

    function obtenerFilas(){
        return Array.from(document.querySelectorAll('.fila-empleado'));
    }

    function renderizarPagina(){
        const todas=obtenerFilas();
        const total=filasFiltradas.length;
        const totalPaginas=Math.max(1,Math.ceil(total/filasPorPagina));
        if(paginaActual>totalPaginas) paginaActual=totalPaginas;

        const inicio=(paginaActual-1)*filasPorPagina;
        const fin=Math.min(inicio+filasPorPagina,total);

        todas.forEach(f=>f.style.display='none');
        filasFiltradas.slice(inicio,fin).forEach(f=>f.style.display='');

        document.getElementById('contador-total').textContent=total;

        const cont=document.getElementById('paginacion-empleados');
        const info=document.getElementById('paginacion-info');
        const nums=document.getElementById('numeros-pagina');
        const anterior=document.getElementById('pagina-anterior');
        const siguiente=document.getElementById('pagina-siguiente');

        if(total===0){
            cont.classList.add('hidden');
            return;
        }

        cont.classList.remove('hidden');
        info.textContent=`Mostrando ${inicio+1}–${fin} de ${total} empleados`;
        anterior.disabled=paginaActual===1;
        siguiente.disabled=paginaActual===totalPaginas;
        nums.innerHTML='';

        obtenerPaginasVisibles(totalPaginas,paginaActual).forEach(p=>{
            if(p==='...'){
                const span=document.createElement('span');
                span.className='page-btn border-transparent bg-transparent pointer-events-none';
                span.textContent='…';
                nums.appendChild(span);
                return;
            }
            const b=document.createElement('button');
            b.type='button';
            b.className='page-btn'+(p===paginaActual?' active':'');
            b.textContent=p;
            b.onclick=()=>irAPagina(p);
            nums.appendChild(b);
        });
    }

    function obtenerPaginasVisibles(total,actual){
        if(total<=5) return Array.from({length:total},(_,i)=>i+1);
        if(actual<=3) return [1,2,3,4,'...',total];
        if(actual>=total-2) return [1,'...',total-3,total-2,total-1,total];
        return [1,'...',actual-1,actual,actual+1,'...',total];
    }

    function irAPagina(p){
        paginaActual=p;
        renderizarPagina();
        if(window.innerWidth<768){
            document.getElementById('buscador-tabla')?.scrollIntoView({behavior:'smooth',block:'start'});
        }
    }

    function cambiarPagina(delta){
        const totalPaginas=Math.max(1,Math.ceil(filasFiltradas.length/filasPorPagina));
        const nueva=paginaActual+delta;
        if(nueva<1||nueva>totalPaginas) return;
        irAPagina(nueva);
    }

    window.addEventListener('resize',()=>{
        const nuevo=window.innerWidth<768?5:10;
        if(nuevo!==filasPorPagina){
            filasPorPagina=nuevo;
            paginaActual=1;
            renderizarPagina();
        }
    });

    document.addEventListener('DOMContentLoaded',()=>{
        filasFiltradas=obtenerFilas();
        renderizarPagina();
    });

</script>

</body>

</html>
