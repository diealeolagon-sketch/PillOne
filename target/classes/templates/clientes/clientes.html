<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Clientes</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{
                        sans:['Poppins','sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-pillone-bg font-sans text-pillone-text antialiased min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Gestión de Clientes')"></header>

<div class="flex flex-1 relative">

    <div id="overlay"
         onclick="toggleSidebar()"
         class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden">
    </div>

    <aside th:replace="fragments/layout :: sidebar('clientes')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5">

                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">

                    <div>

                        <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase tracking-tight">
                            Clientes
                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Consulte pacientes, información personal, historial y fórmulas médicas.
                        </p>

                    </div>

                    <!-- BOTONES GENERALES -->
                    <div class="flex flex-wrap gap-2">

                        <!-- NUEVA FORMULA GENERAL -->
                        <a th:href="@{/view/formulas/form}"
                           class="inline-flex items-center justify-center gap-2 rounded-lg bg-pillone-dark px-4 py-2.5 text-xs font-bold text-white shadow-sm hover:bg-pillone-darker transition">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z">
                                </path>

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M14 2v6h6M12 12v6M9 15h6">
                                </path>

                            </svg>

                            Nueva fórmula

                        </a>

                        <!-- NUEVO CLIENTE -->
                        <a th:href="@{/view/clientes/form}"
                           class="inline-flex items-center justify-center gap-2 rounded-lg bg-pillone-accent px-4 py-2.5 text-xs font-bold text-white shadow-sm hover:opacity-90 transition">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 4v16m8-8H4">
                                </path>

                            </svg>

                            Nuevo cliente

                        </a>

                    </div>

                </div>

            </section>

            <!-- MENSAJES -->
            <div th:if="${mensaje}"
                 class="mb-4 rounded-lg bg-emerald-50 border border-emerald-200 p-3 text-emerald-800 font-medium"
                 th:text="${mensaje}">
            </div>

            <div th:if="${error}"
                 class="mb-4 rounded-lg bg-red-50 border border-red-200 p-3 text-red-700 font-medium"
                 th:text="${error}">
            </div>

            <!-- TABLA -->
            <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                <!-- BUSCADOR -->
                <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

                    <div class="relative w-full sm:w-96">

                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z">
                                </path>

                            </svg>

                        </span>

                        <input type="text"
                               id="buscar"
                               oninput="filtrar()"
                               placeholder="Buscar cliente, documento, teléfono o EPS..."
                               class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 outline-none focus:border-pillone-accent">

                    </div>

                    <div class="text-slate-500">

                        Total:

                        <strong id="contador"
                                class="text-pillone-dark"
                                th:text="${#lists.size(clientes)}">
                            0
                        </strong>

                    </div>

                </div>

                <div class="overflow-x-auto">

                    <table class="min-w-full text-xs text-left">

                        <thead>

                        <tr class="bg-pillone-dark text-white uppercase text-[10px] tracking-wider">

                            <th class="px-4 py-3">
                                Cliente
                            </th>

                            <th class="px-4 py-3">
                                Documento
                            </th>

                            <th class="px-4 py-3">
                                Contacto
                            </th>

                            <th class="px-4 py-3">
                                EPS
                            </th>

                            <th class="px-4 py-3">
                                Alergias
                            </th>

                            <th class="px-4 py-3 text-center">
                                Acciones
                            </th>

                        </tr>

                        </thead>

                        <tbody class="divide-y divide-slate-100">

                        <!-- SIN CLIENTES -->
                        <tr th:if="${#lists.isEmpty(clientes)}">

                            <td colspan="6"
                                class="p-10 text-center text-slate-400">

                                No hay clientes registrados.

                            </td>

                        </tr>

                        <!-- CLIENTES -->
                        <tr th:each="cliente : ${clientes}"
                            class="fila-cliente hover:bg-slate-50 transition">

                            <!-- CLIENTE -->
                            <td class="px-4 py-3">

                                <div class="font-bold text-slate-800"
                                     th:text="${cliente.nombreCompleto}">
                                    Cliente
                                </div>

                                <div class="text-[10px] text-slate-400"
                                     th:text="${cliente.correo != null ? cliente.correo : ''}">
                                </div>

                            </td>

                            <!-- DOCUMENTO -->
                            <td class="px-4 py-3">

                                <div class="font-semibold"
                                     th:text="${cliente.tipoDocumento != null ? cliente.tipoDocumento : '-'}">
                                </div>

                                <div class="text-[10px] text-slate-400"
                                     th:text="${cliente.numeroDocumento}">
                                </div>

                            </td>

                            <!-- CONTACTO -->
                            <td class="px-4 py-3">

                                <div th:text="${cliente.telefono != null && !cliente.telefono.isEmpty() ? cliente.telefono : '-'}">
                                </div>

                                <div class="text-[10px] text-slate-400"
                                     th:text="${cliente.direccion != null ? cliente.direccion : ''}">
                                </div>

                            </td>

                            <!-- EPS -->
                            <td class="px-4 py-3"
                                th:text="${cliente.eps != null && !cliente.eps.isEmpty() ? cliente.eps : '-'}">
                            </td>

                            <!-- ALERGIAS -->
                            <td class="px-4 py-3">

                                <span th:if="${cliente.alergias != null && !cliente.alergias.isEmpty()}"
                                      class="inline-flex px-2 py-1 rounded-lg bg-red-50 text-red-700 font-semibold"
                                      th:text="${cliente.alergias}">
                                </span>

                                <span th:unless="${cliente.alergias != null && !cliente.alergias.isEmpty()}"
                                      class="text-slate-400">

                                    Sin registro

                                </span>

                            </td>

                            <!-- ACCIONES -->
                            <td class="px-4 py-3">

                                <div class="flex items-center justify-center gap-2">

                                    <!-- VER -->
                                    <a th:href="@{/view/clientes/ver/{id}(id=${cliente.id_cliente})}"
                                       class="p-2 rounded-lg bg-slate-50 text-slate-500 hover:bg-pillone-dark hover:text-white transition"
                                       title="Ver cliente">

                                        <svg class="w-4 h-4"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.8"
                                             viewBox="0 0 24 24">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12z">
                                            </path>

                                            <circle cx="12"
                                                    cy="12"
                                                    r="3">
                                            </circle>

                                        </svg>

                                    </a>

                                    <!-- FORMULA DEL CLIENTE -->
                                    <a th:href="@{/view/formulas/form(cliente=${cliente.id_cliente})}"
                                       class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-pillone-accent/10 text-pillone-accent font-bold hover:bg-pillone-accent hover:text-white transition"
                                       title="Crear fórmula médica">

                                        <svg class="w-4 h-4"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.8"
                                             viewBox="0 0 24 24">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z">
                                            </path>

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M14 2v6h6M12 12v6M9 15h6">
                                            </path>

                                        </svg>

                                        Fórmula

                                    </a>

                                    <!-- EDITAR -->
                                    <a th:href="@{/view/clientes/edit/{id}(id=${cliente.id_cliente})}"
                                       class="p-2 rounded-lg bg-slate-50 text-slate-500 hover:bg-pillone-accent/10 hover:text-pillone-accent transition"
                                       title="Editar cliente">

                                        <svg class="w-4 h-4"
                                             fill="none"
                                             stroke="currentColor"
                                             stroke-width="1.8"
                                             viewBox="0 0 24 24">

                                            <path stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                  d="M15.232 5.232l3.536 3.536M4 20l4.5-1 10.268-10.268a2.5 2.5 0 10-3.536-3.536L4.964 15.464 4 20z">
                                            </path>

                                        </svg>

                                    </a>

                                </div>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>
    function filtrar(){
        const q=document.getElementById('buscar').value.toLowerCase();
        let visibles=0;

        document.querySelectorAll('.fila-cliente').forEach(fila=>{
            const mostrar=fila.textContent.toLowerCase().includes(q);

            fila.style.display=mostrar?'':'none';

            if(mostrar){
                visibles++;
            }
        });

        document.getElementById('contador').textContent=visibles;
    }
</script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
