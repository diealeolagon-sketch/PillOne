<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PillOne - Proveedor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <th:block th:replace="fragments/layout :: styles"></th:block>


    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .provider-form-shell{background:var(--pillone-bg);}
        .provider-form-panel{
            background:#fff;border:1px solid var(--ui-border);box-shadow:var(--ui-shadow);
        }
        .provider-control{
            border:1px solid var(--ui-border);background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
        }
        .provider-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);background:#fff;
        }
        .provider-label{
            display:block;color:#475467;font-size:11px;font-weight:700;
            letter-spacing:.035em;text-transform:uppercase;margin-bottom:.45rem;
        }
        .provider-actions{
            position:sticky;bottom:0;z-index:5;
            background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
        }
        @media(max-width:640px){
            .provider-form-main{padding:1rem!important;}
            .provider-form-header{align-items:stretch!important;}
            .provider-form-header>a{width:100%;justify-content:center;}
            .provider-actions{display:grid!important;grid-template-columns:1fr;}
            .provider-actions>*{width:100%;justify-content:center;text-align:center;}
        }
    </style>

</head>


<body class="bg-pillone-bg font-sans text-pillone-text min-h-screen flex flex-col text-xs">

<header th:replace="fragments/layout :: topbar('Proveedores')"></header>

<div class="provider-form-shell flex flex-1 relative">

    <aside th:replace="fragments/layout :: sidebar('proveedores')"></aside>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="provider-form-main flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">


            <section class="mb-5">

                <div class="provider-form-header flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                    <div>

                        <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark"
                            th:text="${proveedor.id_proveedor != null ? 'Editar Proveedor' : 'Nuevo Proveedor'}">

                            Proveedor

                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Registre los datos comerciales y de contacto del proveedor.
                        </p>

                    </div>


                    <a th:href="@{/view/proveedores}"
                       class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold hover:bg-slate-50 transition">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>Volver

                    </a>

                </div>

            </section>


            <div th:if="${error}"
                 class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 font-semibold"
                 th:text="${error}">
            </div>


            <section class="provider-form-panel rounded-2xl p-5 sm:p-7">

                <form th:action="@{/view/proveedores/save}"
                      th:object="${proveedor}"
                      method="post"
                      class="space-y-6">


                    <div class="mb-6 p-4 rounded-xl bg-slate-50 border border-slate-100 flex items-start gap-3">
                        <div class="w-9 h-9 rounded-xl bg-pillone-accent/10 text-pillone-accent flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l7-4 7 4v14M9 10h6M9 14h6"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-pillone-dark">Datos comerciales del proveedor</p>
                            <p class="text-[10px] text-slate-500 mt-1 leading-relaxed">Registra la información que utilizará Compras para crear pedidos y mantener trazabilidad con el proveedor.</p>
                        </div>
                    </div>

                    <input type="hidden"
                           th:field="*{id_proveedor}">


                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">


                        <div>

                            <label class="provider-label">
                                NIT *
                            </label>

                            <input type="text"
                                   th:field="*{nit}"
                                   required
                                   placeholder="Ej. 900123456-1"
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div>

                            <label class="provider-label">
                                Razón Social *
                            </label>

                            <input type="text"
                                   th:field="*{razon_social}"
                                   required
                                   placeholder="Ej. Distribuciones Farmacéuticas S.A.S."
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div>

                            <label class="provider-label">
                                Dirección *
                            </label>

                            <input type="text"
                                   th:field="*{direccion}"
                                   required
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div>

                            <label class="provider-label">
                                Teléfono *
                            </label>

                            <input type="text"
                                   th:field="*{telefono}"
                                   required
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div>

                            <label class="provider-label">
                                Correo *
                            </label>

                            <input type="email"
                                   th:field="*{correo}"
                                   required
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div>

                            <label class="provider-label">
                                Nombre de Contacto *
                            </label>

                            <input type="text"
                                   th:field="*{nombre_contacto}"
                                   required
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div class="sm:col-span-2">

                            <label class="provider-label">
                                Tipo de Productos *
                            </label>

                            <input type="text"
                                   th:field="*{tipo_productos}"
                                   required
                                   placeholder="Ej. Medicamentos, cuidado personal, dispositivos médicos..."
                                   class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                        </div>


                        <div>

                            <label class="provider-label">
                                Estado *
                            </label>

                            <select th:field="*{estado}"
                                    required
                                    class="provider-control w-full px-3.5 py-3 rounded-xl outline-none">

                                <option value="ACTIVO">
                                    ACTIVO
                                </option>

                                <option value="INACTIVO">
                                    INACTIVO
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="provider-actions flex justify-end gap-3 pt-4 border-t border-slate-200">

                        <a th:href="@{/view/proveedores}"
                           class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold hover:bg-slate-50 transition">

                            Cancelar

                        </a>


                        <button type="submit"
                                class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-pillone-dark text-white font-semibold hover:bg-pillone-darker transition">

                            <span th:text="${proveedor.id_proveedor != null ? 'Guardar Cambios' : 'Guardar Proveedor'}">
                                Guardar Proveedor
                            </span>

                        </button>

                    </div>

                </form>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
