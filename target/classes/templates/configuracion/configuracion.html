<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Global - PillOne</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Estilos del sidebar (submenu-container: colapsado + transición) -->
    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pillone: {
                            bg: '#F7F7FF',
                            dark: '#07004D',
                            darker: '#04002C',
                            accent: '#208AAE',
                            text: '#1D1E18'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-pillone-bg text-pillone-text antialiased min-h-screen flex flex-col text-xs font-sans">

<!-- TOPBAR GLOBAL -->
<div th:replace="fragments/layout :: topbar('Configuración del Sistema')"></div>

<!-- CONTENEDOR CENTRAL -->
<div class="flex flex-1 relative min-h-[calc(100vh-4rem)] bg-pillone-bg">

    <!-- OVERLAY MÓVIL -->
    <div id="overlay" class="fixed inset-0 bg-slate-900/60 z-20 hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR GLOBAL -->
    <div th:replace="fragments/layout :: sidebar('configuracion')"></div>

    <!-- AREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 bg-pillone-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">

            <!-- ENCABEZADO -->
            <section class="mb-5">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                        <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase tracking-tight">
                            Parámetros del Sistema
                        </h1>
                        <p class="text-xs text-slate-500 mt-1">
                            Administra los datos corporativos, fiscales y de control operativo de la farmacia en PillOne.
                        </p>
                    </div>
                </div>
            </section>

            <!-- ALERTA DE ÉXITO -->
            <div th:if="${mensaje}" class="mb-5 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl flex items-center justify-between shadow-xs">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    <span class="font-medium" th:text="${mensaje}"></span>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-200/60 text-emerald-900 px-2 py-0.5 rounded">Éxito</span>
            </div>

            <form th:action="@{/view/configuracion/save}"
                  th:object="${configuracion}"
                  method="post"
                  novalidate>

                <input type="hidden" th:field="*{id}" />

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-5 items-start">

                    <!-- SECCIÓN 1: DATOS CORPORATIVOS Y FISCALES -->
                    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col">

                        <div class="px-5 py-3.5 border-b border-slate-100 bg-slate-50/50 flex items-center gap-2">
                            <svg class="w-4 h-4 text-pillone-accent shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                            </svg>
                            <h2 class="text-xs font-extrabold text-pillone-dark uppercase tracking-wider">
                                Información Corporativa y Fiscal
                            </h2>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">

                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Nombre Comercial de la Farmacia
                                </label>
                                <input type="text" th:field="*{nombreFarmacia}" required
                                       placeholder="Ej: FarmaSoft Plus S.A.S."
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    NIT / Identificación Fiscal
                                </label>
                                <input type="text" th:field="*{nit}" required
                                       placeholder="Ej: 900123456-7"
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Moneda del Sistema
                                </label>
                                <input type="text" th:field="*{moneda}"
                                       placeholder="Ej: COP"
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Teléfono de Contacto
                                </label>
                                <input type="text" th:field="*{telefono}"
                                       placeholder="Ej: 6022345678"
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Dirección de la Sede
                                </label>
                                <input type="text" th:field="*{direccion}"
                                       placeholder="Ej: Calle Principal # 10-20"
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                        </div>
                    </section>

                    <!-- SECCIÓN 2: PARÁMETROS FINANCIEROS Y DE ALERTA -->
                    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col">

                        <div class="px-5 py-3.5 border-b border-slate-100 bg-slate-50/50 flex items-center gap-2">
                            <svg class="w-4 h-4 text-pillone-accent shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <h2 class="text-xs font-extrabold text-pillone-dark uppercase tracking-wider">
                                Parámetros Financieros y Alertas
                            </h2>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Porcentaje de IVA General (%)
                                </label>
                                <input type="number" step="0.01" th:field="*{ivaGeneral}" required
                                       placeholder="19.00"
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
                                    Alerta Vencimiento (Días)
                                </label>
                                <input type="number" th:field="*{tiempoAlertaVencimientoDias}" required
                                       placeholder="60"
                                       class="w-full rounded-lg border border-slate-200 bg-slate-50/50 px-3.5 py-2 text-xs outline-none focus:border-pillone-accent focus:bg-white focus:ring-2 focus:ring-pillone-accent/20 transition">
                            </div>

                            <div class="md:col-span-2 mt-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-2">
                                    Métodos de Pago Habilitados en Caja (POS)
                                </label>
                                <div class="flex flex-wrap gap-1.5 p-3 rounded-lg border border-slate-200 bg-slate-50/50">
                                    <span th:each="metodo : ${metodosPago}"
                                          class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-semibold bg-pillone-accent/10 text-pillone-accent border border-pillone-accent/20"
                                          th:text="${metodo}"></span>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-1">Estos métodos operan de forma global en los registros de ventas del sistema.</p>
                            </div>

                        </div>
                    </section>

                </div>

                <!-- BOTONERA DE ACCIÓN -->
                <div class="flex items-center justify-end gap-3 mt-5">
                    <a th:href="@{/view/configuracion}"
                       class="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-5 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 hover:text-pillone-accent transition shadow-xs cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Recargar Valores
                    </a>

                    <button type="submit"
                            class="inline-flex items-center gap-2 rounded-lg bg-pillone-accent px-6 py-2 text-xs font-bold text-white shadow-sm hover:opacity-90 transition cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        Guardar Configuración
                    </button>
                </div>

            </form>

        </main>

        <!-- FOOTER GLOBAL -->
        <footer th:replace="fragments/layout :: footer"></footer>
    </div>
</div>

<!-- Scripts del sidebar (toggleSidebar / toggleSubmenu) -->
<div th:replace="fragments/layout :: scripts"></div>

<script th:src="@{/js/script.js}" defer></script>

</body>
</html>
