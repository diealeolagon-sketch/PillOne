<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{sans:['Poppins','sans-serif']}
                }
            }
        }
    </script>

    <style>
        :root{
            --pillone-bg:#F7F7FF;
            --pillone-dark:#07004D;
            --pillone-darker:#04002C;
            --pillone-accent:#208AAE;
            --pillone-text:#1D1E18;
            --ui-border:#E7E9F0;
            --ui-shadow:0 10px 30px rgba(7,0,77,.055);
        }
        .sales-shell{
            background:
                radial-gradient(circle at top right,rgba(32,138,174,.06),transparent 30rem),
                var(--pillone-bg);
        }
        .sales-panel{
            background:rgba(255,255,255,.98);
            border:1px solid var(--ui-border);
            box-shadow:var(--ui-shadow);
        }
        .sales-control{
            border:1px solid var(--ui-border);
            background:#FBFCFE;
            transition:border-color .15s ease,box-shadow .15s ease;
        }
        .sales-control:focus{
            border-color:var(--pillone-accent)!important;
            box-shadow:0 0 0 3px rgba(32,138,174,.12);
            background:#fff;
        }
        .sales-table tbody tr{
            transition:background .15s ease,box-shadow .15s ease;
        }
        .sales-table tbody tr:hover{
            background:#FAFBFE;
            box-shadow:inset 3px 0 0 rgba(32,138,174,.5);
        }
        .sales-pagination{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            padding:.9rem 1rem;
            border-top:1px solid var(--ui-border);
            background:#fff;
        }
        .page-controls{
            display:flex;
            align-items:center;
            gap:.35rem;
        }
        .page-btn{
            min-width:2.25rem;
            height:2.25rem;
            padding:0 .7rem;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:1px solid var(--ui-border);
            border-radius:.65rem;
            background:#fff;
            color:#475467;
            font-size:.72rem;
            font-weight:600;
        }
        .page-btn.active{
            background:var(--pillone-dark);
            color:#fff;
            border-color:var(--pillone-dark);
        }
        .page-btn:disabled{
            opacity:.4;
            cursor:not-allowed;
        }
        @media(max-width:767px){
            .sales-main{padding:1rem!important;}
            .sales-actions{width:100%;}
            .sales-actions a{flex:1;}
            .sales-toolbar{
                position:sticky;
                top:0;
                z-index:7;
                background:rgba(255,255,255,.96);
                backdrop-filter:blur(10px);
            }
            #buscador{font-size:16px!important;}
            .sales-table-wrap{
                overflow:visible!important;
                padding:.75rem;
                background:#F7F7FF;
            }
            .sales-table,
            .sales-table tbody{
                display:block;
                width:100%;
                min-width:0!important;
            }
            .sales-table thead{display:none;}
            .sales-table tbody{border:0!important;}
            .sales-table .fila-venta{
                display:block;
                background:#fff;
                border:1px solid var(--ui-border);
                border-radius:1rem;
                margin-bottom:.7rem;
                overflow:hidden;
                box-shadow:0 6px 18px rgba(7,0,77,.04);
            }
            .sales-table .fila-venta td{
                display:flex;
                align-items:flex-start;
                justify-content:space-between;
                gap:1rem;
                padding:.62rem .85rem!important;
                text-align:right!important;
                border:0;
            }
            .sales-table .fila-venta td::before{
                content:attr(data-label);
                flex:0 0 6.2rem;
                text-align:left;
                color:#98A2B3;
                font-size:.62rem;
                font-weight:700;
                text-transform:uppercase;
            }
            .sales-table .fila-venta td:first-child{
                background:#FCFCFE;
                border-bottom:1px solid #F0F1F5;
                padding-top:.8rem!important;
                padding-bottom:.8rem!important;
            }
            .sales-pagination{
                position:sticky;
                bottom:0;
                z-index:6;
                flex-direction:column;
                align-items:stretch;
                gap:.55rem;
                padding:.75rem;
                background:rgba(255,255,255,.97);
                backdrop-filter:blur(10px);
            }
            .page-controls{justify-content:center;}
            #paginacion-info{text-align:center;}
        }
    </style>

</head>

<body class="bg-pillone-bg font-sans text-pillone-text min-h-screen flex flex-col text-xs">

<div th:replace="fragments/layout :: topbar('Ventas')"></div>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)] sales-shell">

    <div th:replace="fragments/layout :: sidebar('ventas')"></div>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="sales-main flex-1 p-4 sm:p-6 lg:p-8">

            <div id="mensaje" class="hidden mb-4 rounded-lg p-3 text-xs font-medium"></div>

            <section class="mb-5">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">

                    <div>
                        <h1 class="text-2xl md:text-[30px] leading-tight font-bold text-pillone-dark">
                            Historial de Ventas
                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Consulte las ventas registradas y el estado de sus domicilios.
                        </p>
                    </div>

                    <div class="sales-actions flex flex-col sm:flex-row gap-2">

                        <a th:href="@{/view/domicilios}"
                           class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-semibold text-pillone-dark hover:bg-slate-50 transition">
                            Ver Domicilios
                        </a>

                        <a th:href="@{/view/ventas/form}"
                           class="inline-flex items-center justify-center gap-2 rounded-xl bg-pillone-dark px-4 py-2.5 text-xs font-semibold text-white hover:bg-pillone-darker transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg> Nueva venta
                        </a>

                    </div>

                </div>
            </section>

            <section class="sales-panel rounded-2xl overflow-hidden">

                <div class="sales-toolbar p-4 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">

                    <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">

                        <div class="relative w-full sm:w-80">
                            <input type="text"
                                   id="buscador"
                                   placeholder="Buscar factura, cliente, empleado..."
                                   onkeyup="filtrarTabla()"
                                   class="sales-control w-full px-4 py-2.5 text-xs rounded-xl outline-none">
                        </div>

                        <select id="filtroTipo"
                                onchange="filtrarTabla()"
                                class="sales-control px-4 py-2.5 text-xs rounded-xl outline-none">

                            <option value="">
                                Todas las ventas
                            </option>

                            <option value="MOSTRADOR">
                                Mostrador
                            </option>

                            <option value="DOMICILIO">
                                Domicilios
                            </option>

                        </select>

                    </div>

                    <div class="text-xs text-slate-500">
                        Total registros:
                        <span id="contador" class="font-bold text-pillone-dark">0</span>
                    </div>

                </div>

                <div class="sales-table-wrap overflow-x-auto">

                    <table class="sales-table min-w-full text-xs text-left">

                        <thead>

                        <tr class="bg-pillone-dark text-white uppercase text-[10px] tracking-wider">

                            <th class="px-4 py-3">
                                Factura
                            </th>

                            <th class="px-4 py-3">
                                Fecha
                            </th>

                            <th class="px-4 py-3">
                                Cliente
                            </th>

                            <th class="px-4 py-3">
                                Empleado
                            </th>

                            <th class="px-4 py-3">
                                Sucursal
                            </th>

                            <th class="px-4 py-3">
                                Total
                            </th>

                            <th class="px-4 py-3">
                                Método
                            </th>

                            <th class="px-4 py-3">
                                Tipo
                            </th>

                            <th class="px-4 py-3">
                                Entrega
                            </th>

                            <th class="px-4 py-3">
                                Estado venta
                            </th>

                        </tr>

                        </thead>

                        <tbody id="tabla-ventas"
                               class="divide-y divide-slate-100">

                        <tr>
                            <td colspan="10"
                                class="text-center py-10 text-slate-400">
                                Cargando ventas...
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

                <div id="paginacion-ventas" class="sales-pagination hidden">
                    <div id="paginacion-info" class="text-[11px] text-slate-500">
                        Mostrando 0 de 0 ventas
                    </div>
                    <div class="page-controls">
                        <button type="button" id="pagina-anterior" class="page-btn" onclick="cambiarPagina(-1)" aria-label="Página anterior">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <div id="numeros-pagina" class="page-controls"></div>
                        <button type="button" id="pagina-siguiente" class="page-btn" onclick="cambiarPagina(1)" aria-label="Página siguiente">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>
    let ventas=[];
    let domicilios=[];
    let domiciliosPorVenta=new Map();
    let ventasFiltradas=[];
    let paginaActual=1;
    let filasPorPagina=window.innerWidth<768?5:10;

    document.addEventListener("DOMContentLoaded",()=>{
        cargarDatos();
    });

    async function cargarDatos(){

        const tabla=document.getElementById("tabla-ventas");

        tabla.innerHTML=`
            <tr>
                <td colspan="10" class="text-center py-10 text-slate-400">
                    Cargando ventas...
                </td>
            </tr>
        `;

        try{

            const [ventasResponse,domiciliosResponse]=await Promise.all([
                fetch("/api/ventas"),
                fetch("/api/domicilios")
            ]);

            if(!ventasResponse.ok){
                throw new Error(
                    "Error consultando ventas: "+
                    ventasResponse.status
                );
            }

            ventas=await ventasResponse.json();

            if(domiciliosResponse.ok){
                domicilios=await domiciliosResponse.json();
            }else{
                console.warn(
                    "No fue posible consultar domicilios"
                );
                domicilios=[];
            }

            crearMapaDomicilios();

            ventasFiltradas=[...ventas];
            paginaActual=1;
            renderVentasPaginadas();

        }catch(error){

            console.error(error);

            tabla.innerHTML=`
                <tr>
                    <td colspan="10"
                        class="text-center py-10 text-red-500">
                        No fue posible cargar las ventas.
                    </td>
                </tr>
            `;

            mostrarMensaje(
                "Error cargando el historial de ventas",
                "error"
            );

        }
    }

    function crearMapaDomicilios(){

        domiciliosPorVenta=new Map();

        domicilios.forEach(domicilio=>{

            const idVenta=
                domicilio.venta?.idVenta ??
                domicilio.idVenta ??
                null;

            if(idVenta!=null){
                domiciliosPorVenta.set(
                    Number(idVenta),
                    domicilio
                );
            }

        });
    }

    function obtenerDomicilio(venta){

        if(!venta || venta.idVenta==null){
            return null;
        }

        return domiciliosPorVenta.get(
            Number(venta.idVenta)
        ) || null;
    }

    function renderVentas(lista){

        const tabla=
            document.getElementById(
                "tabla-ventas"
            );

        const contador=
            document.getElementById(
                "contador"
            );

        contador.textContent=
            lista.length;

        tabla.innerHTML="";

        if(lista.length===0){

            tabla.innerHTML=`
                <tr>
                    <td colspan="10"
                        class="text-center py-10 text-slate-400">
                        No hay ventas registradas.
                    </td>
                </tr>
            `;

            return;
        }

        lista.forEach(venta=>{

            const domicilio=
                obtenerDomicilio(venta);

            const cliente=
                venta.cliente?.nombreCompleto ||
                venta.cliente?.nombre_completo ||
                "Sin cliente";

            const empleado=
                venta.empleado?.nombre_completo ||
                venta.empleado?.nombreCompleto ||
                "-";

            const sucursal=
                venta.sucursal?.nombre ||
                "-";

            const fecha=
                formatearFecha(
                    venta.fechaVenta
                );

            const total=
                formatearDinero(
                    venta.total
                );

            const fila=
                document.createElement(
                    "tr"
                );

            fila.className=
                "fila-venta";

            fila.innerHTML=`

                <td class="px-4 py-3 font-bold text-pillone-accent whitespace-nowrap" data-label="Factura">
                    ${venta.numeroFactura || "-"}
                </td>

                <td class="px-4 py-3 whitespace-nowrap" data-label="Fecha">
                    ${fecha}
                </td>

                <td class="px-4 py-3 font-medium" data-label="Cliente">
                    ${cliente}
                </td>

                <td class="px-4 py-3">
                    ${empleado}
                </td>

                <td class="px-4 py-3">
                    ${sucursal}
                </td>

                <td class="px-4 py-3 font-bold whitespace-nowrap" data-label="Total">
                    ${total}
                </td>

                <td class="px-4 py-3">
                    ${venta.metodoPago || "-"}
                </td>

                <td class="px-4 py-3">
                    ${crearBadgeTipo(domicilio)}
                </td>

                <td class="px-4 py-3">
                    ${crearEstadoEntrega(domicilio)}
                </td>

                <td class="px-4 py-3">
                    <span class="px-2 py-1 rounded-lg bg-slate-100 font-semibold whitespace-nowrap">
                        ${venta.estado || "-"}
                    </span>
                </td>
            `;

            tabla.appendChild(
                fila
            );

        });
    }

    function crearBadgeTipo(domicilio){

        if(!domicilio){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-slate-100 text-slate-600 font-semibold whitespace-nowrap">
                    Mostrador
                </span>
            `;
        }

        return `
            <span class="inline-flex items-center px-2 py-1 rounded-lg bg-blue-50 text-blue-700 font-bold whitespace-nowrap">
                Domicilio
            </span>
        `;
    }

    function crearEstadoEntrega(domicilio){

        if(!domicilio){

            return `
                <span class="text-slate-400">
                    No aplica
                </span>
            `;
        }

        const estado=
            domicilio.estado ||
            "PENDIENTE";

        if(estado==="ENTREGADO"){

            const pago=
                domicilio.pagado
                ?
                `
                <span class="inline-flex px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-bold">
                    Pagado
                </span>
                `
                :
                `
                <span class="inline-flex px-2 py-1 rounded-lg bg-amber-50 text-amber-700 font-bold">
                    Pago pendiente
                </span>
                `;

            return `
                <div class="flex flex-col gap-1 items-start">

                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-bold whitespace-nowrap">
                        Entregado
                    </span>

                    ${pago}

                    ${
                        domicilio.fechaHoraEntrega
                        ?
                        `
                        <span class="text-[10px] text-slate-400 whitespace-nowrap">
                            ${formatearFecha(domicilio.fechaHoraEntrega)}
                        </span>
                        `
                        :
                        ""
                    }

                </div>
            `;
        }

        if(estado==="EN_CAMINO"){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-blue-50 text-blue-700 font-bold whitespace-nowrap">
                    En camino
                </span>
            `;
        }

        if(estado==="EN_PREPARACION"){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-violet-50 text-violet-700 font-bold whitespace-nowrap">
                    En preparación
                </span>
            `;
        }

        if(estado==="CANCELADO"){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-red-50 text-red-700 font-bold whitespace-nowrap">
                    Cancelado
                </span>
            `;
        }

        return `
            <span class="inline-flex items-center px-2 py-1 rounded-lg bg-amber-50 text-amber-700 font-bold whitespace-nowrap">
                Pendiente
            </span>
        `;
    }

    function filtrarTabla(){

        const texto=
            document.getElementById(
                "buscador"
            ).value.toLowerCase();

        const tipo=
            document.getElementById(
                "filtroTipo"
            ).value;

        const filtradas=
            ventas.filter(venta=>{

                const domicilio=
                    obtenerDomicilio(venta);

                const tipoVenta=
                    domicilio
                    ? "DOMICILIO"
                    : "MOSTRADOR";

                const contenido=`
                    ${venta.numeroFactura || ""}
                    ${venta.cliente?.nombreCompleto || ""}
                    ${venta.cliente?.nombre_completo || ""}
                    ${venta.empleado?.nombre_completo || ""}
                    ${venta.empleado?.nombreCompleto || ""}
                    ${venta.sucursal?.nombre || ""}
                    ${venta.metodoPago || ""}
                    ${venta.estado || ""}
                    ${tipoVenta}
                    ${domicilio?.estado || ""}
                    ${domicilio?.direccionEntrega || ""}
                    ${domicilio?.telefonoContacto || ""}
                    ${domicilio?.nombreDomiciliario || ""}
                `.toLowerCase();

                const coincideTexto=
                    contenido.includes(
                        texto
                    );

                const coincideTipo=
                    !tipo ||
                    tipo===tipoVenta;

                return(
                    coincideTexto &&
                    coincideTipo
                );

            });

        ventasFiltradas=filtradas;
        paginaActual=1;
        renderVentasPaginadas();
    }

    function renderVentasPaginadas(){
        const total=ventasFiltradas.length;
        const totalPaginas=Math.max(1,Math.ceil(total/filasPorPagina));

        if(paginaActual>totalPaginas){
            paginaActual=totalPaginas;
        }

        const inicio=(paginaActual-1)*filasPorPagina;
        const fin=Math.min(inicio+filasPorPagina,total);
        renderVentas(ventasFiltradas.slice(inicio,fin));

        document.getElementById("contador").textContent=total;
        actualizarPaginacion(total,totalPaginas,inicio,fin);
    }

    function actualizarPaginacion(total,totalPaginas,inicio,fin){
        const cont=document.getElementById("paginacion-ventas");
        const info=document.getElementById("paginacion-info");
        const nums=document.getElementById("numeros-pagina");
        const anterior=document.getElementById("pagina-anterior");
        const siguiente=document.getElementById("pagina-siguiente");

        if(total===0){
            cont.classList.add("hidden");
            return;
        }

        cont.classList.remove("hidden");
        info.textContent=`Mostrando ${inicio+1}–${fin} de ${total} ventas`;
        anterior.disabled=paginaActual===1;
        siguiente.disabled=paginaActual===totalPaginas;
        nums.innerHTML="";

        obtenerPaginasVisibles(totalPaginas,paginaActual).forEach(p=>{
            if(p==="..."){
                const span=document.createElement("span");
                span.className="page-btn border-transparent bg-transparent pointer-events-none";
                span.textContent="…";
                nums.appendChild(span);
                return;
            }
            const b=document.createElement("button");
            b.type="button";
            b.className="page-btn"+(p===paginaActual?" active":"");
            b.textContent=p;
            b.onclick=()=>irAPagina(p);
            nums.appendChild(b);
        });
    }

    function obtenerPaginasVisibles(total,actual){
        if(total<=5) return Array.from({length:total},(_,i)=>i+1);
        if(actual<=3) return [1,2,3,4,"...",total];
        if(actual>=total-2) return [1,"...",total-3,total-2,total-1,total];
        return [1,"...",actual-1,actual,actual+1,"...",total];
    }

    function irAPagina(p){
        paginaActual=p;
        renderVentasPaginadas();
        if(window.innerWidth<768){
            document.getElementById("buscador").scrollIntoView({behavior:"smooth",block:"start"});
        }
    }

    function cambiarPagina(delta){
        const totalPaginas=Math.max(1,Math.ceil(ventasFiltradas.length/filasPorPagina));
        const nueva=paginaActual+delta;
        if(nueva<1||nueva>totalPaginas) return;
        irAPagina(nueva);
    }

    window.addEventListener("resize",()=>{
        const nuevo=window.innerWidth<768?5:10;
        if(nuevo!==filasPorPagina){
            filasPorPagina=nuevo;
            paginaActual=1;
            renderVentasPaginadas();
        }
    });

    function formatearFecha(fecha){

        if(!fecha){
            return "-";
        }

        return new Date(
            fecha
        ).toLocaleString(
            "es-CO"
        );
    }

    function formatearDinero(valor){

        return new Intl.NumberFormat(
            "es-CO",
            {
                style:"currency",
                currency:"COP",
                minimumFractionDigits:0
            }
        ).format(
            valor || 0
        );
    }

    function mostrarMensaje(texto,tipo){

        const mensaje=
            document.getElementById(
                "mensaje"
            );

        mensaje.classList.remove(
            "hidden",
            "bg-red-50",
            "text-red-700",
            "border-red-200",
            "bg-emerald-50",
            "text-emerald-700",
            "border-emerald-200"
        );

        mensaje.classList.add(
            "border"
        );

        if(tipo==="error"){

            mensaje.classList.add(
                "bg-red-50",
                "text-red-700",
                "border-red-200"
            );

        }else{

            mensaje.classList.add(
                "bg-emerald-50",
                "text-emerald-700",
                "border-emerald-200"
            );

        }

        mensaje.textContent=
            texto;
    }
</script>

<div th:replace="fragments/layout :: scripts"></div>

</body>
