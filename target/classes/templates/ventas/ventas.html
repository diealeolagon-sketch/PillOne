<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillOne - Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="fragments/layout :: styles"></th:block>

    <script>
        tailwind.config={
            theme:{
                extend:{
                    colors:{
                        pillone:{
                            bg:'#F7F7FF',
                            dark:'#07004D',
                            darker:'#04002C',
                            accent:'#208AAE',
                            text:'#1D1E18'
                        }
                    },
                    fontFamily:{sans:['Poppins','sans-serif']}
                }
            }
        }
    </script>
</head>

<body class="bg-pillone-bg font-sans text-pillone-text min-h-screen flex flex-col text-xs">

<div th:replace="fragments/layout :: topbar('Ventas')"></div>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">

    <div th:replace="fragments/layout :: sidebar('ventas')"></div>

    <div class="flex-1 flex flex-col min-w-0">

        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <div id="mensaje" class="hidden mb-4 rounded-lg p-3 text-xs font-medium"></div>

            <section class="mb-5">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">

                    <div>
                        <h1 class="text-xl md:text-2xl font-extrabold text-pillone-dark uppercase">
                            Historial de Ventas
                        </h1>

                        <p class="text-xs text-slate-500 mt-1">
                            Consulte las ventas registradas y el estado de sus domicilios.
                        </p>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2">

                        <a th:href="@{/view/domicilios}"
                           class="inline-flex items-center justify-center gap-2 rounded-lg border border-pillone-accent px-4 py-2.5 text-xs font-bold text-pillone-accent hover:bg-pillone-accent hover:text-white transition">
                            Ver Domicilios
                        </a>

                        <a th:href="@{/view/ventas/form}"
                           class="inline-flex items-center justify-center gap-2 rounded-lg bg-pillone-accent px-4 py-2.5 text-xs font-bold text-white">
                            + Nueva Venta
                        </a>

                    </div>

                </div>
            </section>

            <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                <div class="p-4 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">

                    <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">

                        <div class="relative w-full sm:w-80">
                            <input type="text"
                                   id="buscador"
                                   placeholder="Buscar factura, cliente, empleado..."
                                   onkeyup="filtrarTabla()"
                                   class="w-full px-4 py-2.5 text-xs rounded-lg border border-slate-200 outline-none focus:border-pillone-accent bg-slate-50">
                        </div>

                        <select id="filtroTipo"
                                onchange="filtrarTabla()"
                                class="px-4 py-2.5 text-xs rounded-lg border border-slate-200 bg-white outline-none focus:border-pillone-accent">

                            <option value="">
                                Todas las ventas
                            </option>

                            <option value="MOSTRADOR">
                                Mostrador
                            </option>

                            <option value="DOMICILIO">
                                Domicilios
                            </option>

                        </select>

                    </div>

                    <div class="text-xs text-slate-500">
                        Total registros:
                        <span id="contador" class="font-bold text-pillone-dark">0</span>
                    </div>

                </div>

                <div class="overflow-x-auto">

                    <table class="min-w-full text-xs text-left">

                        <thead>

                        <tr class="bg-pillone-dark text-white uppercase text-[10px] tracking-wider">

                            <th class="px-4 py-3">
                                Factura
                            </th>

                            <th class="px-4 py-3">
                                Fecha
                            </th>

                            <th class="px-4 py-3">
                                Cliente
                            </th>

                            <th class="px-4 py-3">
                                Empleado
                            </th>

                            <th class="px-4 py-3">
                                Sucursal
                            </th>

                            <th class="px-4 py-3">
                                Total
                            </th>

                            <th class="px-4 py-3">
                                Método
                            </th>

                            <th class="px-4 py-3">
                                Tipo
                            </th>

                            <th class="px-4 py-3">
                                Entrega
                            </th>

                            <th class="px-4 py-3">
                                Estado venta
                            </th>

                        </tr>

                        </thead>

                        <tbody id="tabla-ventas"
                               class="divide-y divide-slate-100">

                        <tr>
                            <td colspan="10"
                                class="text-center py-10 text-slate-400">
                                Cargando ventas...
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

</div>

<script>
    let ventas=[];
    let domicilios=[];
    let domiciliosPorVenta=new Map();

    document.addEventListener("DOMContentLoaded",()=>{
        cargarDatos();
    });

    async function cargarDatos(){

        const tabla=document.getElementById("tabla-ventas");

        tabla.innerHTML=`
            <tr>
                <td colspan="10" class="text-center py-10 text-slate-400">
                    Cargando ventas...
                </td>
            </tr>
        `;

        try{

            const [ventasResponse,domiciliosResponse]=await Promise.all([
                fetch("/api/ventas"),
                fetch("/api/domicilios")
            ]);

            if(!ventasResponse.ok){
                throw new Error(
                    "Error consultando ventas: "+
                    ventasResponse.status
                );
            }

            ventas=await ventasResponse.json();

            if(domiciliosResponse.ok){
                domicilios=await domiciliosResponse.json();
            }else{
                console.warn(
                    "No fue posible consultar domicilios"
                );
                domicilios=[];
            }

            crearMapaDomicilios();

            renderVentas(ventas);

        }catch(error){

            console.error(error);

            tabla.innerHTML=`
                <tr>
                    <td colspan="10"
                        class="text-center py-10 text-red-500">
                        No fue posible cargar las ventas.
                    </td>
                </tr>
            `;

            mostrarMensaje(
                "Error cargando el historial de ventas",
                "error"
            );

        }
    }

    function crearMapaDomicilios(){

        domiciliosPorVenta=new Map();

        domicilios.forEach(domicilio=>{

            const idVenta=
                domicilio.venta?.idVenta ??
                domicilio.idVenta ??
                null;

            if(idVenta!=null){
                domiciliosPorVenta.set(
                    Number(idVenta),
                    domicilio
                );
            }

        });
    }

    function obtenerDomicilio(venta){

        if(!venta || venta.idVenta==null){
            return null;
        }

        return domiciliosPorVenta.get(
            Number(venta.idVenta)
        ) || null;
    }

    function renderVentas(lista){

        const tabla=
            document.getElementById(
                "tabla-ventas"
            );

        const contador=
            document.getElementById(
                "contador"
            );

        contador.textContent=
            lista.length;

        tabla.innerHTML="";

        if(lista.length===0){

            tabla.innerHTML=`
                <tr>
                    <td colspan="10"
                        class="text-center py-10 text-slate-400">
                        No hay ventas registradas.
                    </td>
                </tr>
            `;

            return;
        }

        lista.forEach(venta=>{

            const domicilio=
                obtenerDomicilio(venta);

            const cliente=
                venta.cliente?.nombreCompleto ||
                venta.cliente?.nombre_completo ||
                "Sin cliente";

            const empleado=
                venta.empleado?.nombre_completo ||
                venta.empleado?.nombreCompleto ||
                "-";

            const sucursal=
                venta.sucursal?.nombre ||
                "-";

            const fecha=
                formatearFecha(
                    venta.fechaVenta
                );

            const total=
                formatearDinero(
                    venta.total
                );

            const fila=
                document.createElement(
                    "tr"
                );

            fila.className=
                "fila-venta hover:bg-pillone-bg/40 transition";

            fila.innerHTML=`

                <td class="px-4 py-3 font-bold text-pillone-accent whitespace-nowrap">
                    ${venta.numeroFactura || "-"}
                </td>

                <td class="px-4 py-3 whitespace-nowrap">
                    ${fecha}
                </td>

                <td class="px-4 py-3 font-medium">
                    ${cliente}
                </td>

                <td class="px-4 py-3">
                    ${empleado}
                </td>

                <td class="px-4 py-3">
                    ${sucursal}
                </td>

                <td class="px-4 py-3 font-bold whitespace-nowrap">
                    ${total}
                </td>

                <td class="px-4 py-3">
                    ${venta.metodoPago || "-"}
                </td>

                <td class="px-4 py-3">
                    ${crearBadgeTipo(domicilio)}
                </td>

                <td class="px-4 py-3">
                    ${crearEstadoEntrega(domicilio)}
                </td>

                <td class="px-4 py-3">
                    <span class="px-2 py-1 rounded-lg bg-slate-100 font-semibold whitespace-nowrap">
                        ${venta.estado || "-"}
                    </span>
                </td>
            `;

            tabla.appendChild(
                fila
            );

        });
    }

    function crearBadgeTipo(domicilio){

        if(!domicilio){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-slate-100 text-slate-600 font-semibold whitespace-nowrap">
                    Mostrador
                </span>
            `;
        }

        return `
            <span class="inline-flex items-center px-2 py-1 rounded-lg bg-blue-50 text-blue-700 font-bold whitespace-nowrap">
                Domicilio
            </span>
        `;
    }

    function crearEstadoEntrega(domicilio){

        if(!domicilio){

            return `
                <span class="text-slate-400">
                    No aplica
                </span>
            `;
        }

        const estado=
            domicilio.estado ||
            "PENDIENTE";

        if(estado==="ENTREGADO"){

            const pago=
                domicilio.pagado
                ?
                `
                <span class="inline-flex px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-bold">
                    Pagado
                </span>
                `
                :
                `
                <span class="inline-flex px-2 py-1 rounded-lg bg-amber-50 text-amber-700 font-bold">
                    Pago pendiente
                </span>
                `;

            return `
                <div class="flex flex-col gap-1 items-start">

                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-bold whitespace-nowrap">
                        ✓ Entregado
                    </span>

                    ${pago}

                    ${
                        domicilio.fechaHoraEntrega
                        ?
                        `
                        <span class="text-[10px] text-slate-400 whitespace-nowrap">
                            ${formatearFecha(domicilio.fechaHoraEntrega)}
                        </span>
                        `
                        :
                        ""
                    }

                </div>
            `;
        }

        if(estado==="EN_CAMINO"){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-blue-50 text-blue-700 font-bold whitespace-nowrap">
                    En camino
                </span>
            `;
        }

        if(estado==="EN_PREPARACION"){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-violet-50 text-violet-700 font-bold whitespace-nowrap">
                    En preparación
                </span>
            `;
        }

        if(estado==="CANCELADO"){

            return `
                <span class="inline-flex items-center px-2 py-1 rounded-lg bg-red-50 text-red-700 font-bold whitespace-nowrap">
                    Cancelado
                </span>
            `;
        }

        return `
            <span class="inline-flex items-center px-2 py-1 rounded-lg bg-amber-50 text-amber-700 font-bold whitespace-nowrap">
                Pendiente
            </span>
        `;
    }

    function filtrarTabla(){

        const texto=
            document.getElementById(
                "buscador"
            ).value.toLowerCase();

        const tipo=
            document.getElementById(
                "filtroTipo"
            ).value;

        const filtradas=
            ventas.filter(venta=>{

                const domicilio=
                    obtenerDomicilio(venta);

                const tipoVenta=
                    domicilio
                    ? "DOMICILIO"
                    : "MOSTRADOR";

                const contenido=`
                    ${venta.numeroFactura || ""}
                    ${venta.cliente?.nombreCompleto || ""}
                    ${venta.cliente?.nombre_completo || ""}
                    ${venta.empleado?.nombre_completo || ""}
                    ${venta.empleado?.nombreCompleto || ""}
                    ${venta.sucursal?.nombre || ""}
                    ${venta.metodoPago || ""}
                    ${venta.estado || ""}
                    ${tipoVenta}
                    ${domicilio?.estado || ""}
                    ${domicilio?.direccionEntrega || ""}
                    ${domicilio?.telefonoContacto || ""}
                    ${domicilio?.nombreDomiciliario || ""}
                `.toLowerCase();

                const coincideTexto=
                    contenido.includes(
                        texto
                    );

                const coincideTipo=
                    !tipo ||
                    tipo===tipoVenta;

                return(
                    coincideTexto &&
                    coincideTipo
                );

            });

        renderVentas(
            filtradas
        );
    }

    function formatearFecha(fecha){

        if(!fecha){
            return "-";
        }

        return new Date(
            fecha
        ).toLocaleString(
            "es-CO"
        );
    }

    function formatearDinero(valor){

        return new Intl.NumberFormat(
            "es-CO",
            {
                style:"currency",
                currency:"COP",
                minimumFractionDigits:0
            }
        ).format(
            valor || 0
        );
    }

    function mostrarMensaje(texto,tipo){

        const mensaje=
            document.getElementById(
                "mensaje"
            );

        mensaje.classList.remove(
            "hidden",
            "bg-red-50",
            "text-red-700",
            "border-red-200",
            "bg-emerald-50",
            "text-emerald-700",
            "border-emerald-200"
        );

        mensaje.classList.add(
            "border"
        );

        if(tipo==="error"){

            mensaje.classList.add(
                "bg-red-50",
                "text-red-700",
                "border-red-200"
            );

        }else{

            mensaje.classList.add(
                "bg-emerald-50",
                "text-emerald-700",
                "border-emerald-200"
            );

        }

        mensaje.textContent=
            texto;
    }
</script>

<div th:replace="fragments/layout :: scripts"></div>

</body>
</html>
